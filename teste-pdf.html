<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Teste PDF</title>
</head>

<body>

<h2>Teste Leitor PDF</h2>

<input type="file" id="pdfFile" accept="application/pdf">

<pre id="resultado"></pre>


<script type="module">

import { lerPDF } from "./services/pdf-reader.js";


const input = document.getElementById("pdfFile");
const resultado = document.getElementById("resultado");


input.addEventListener("change", async()=>{


const arquivo = input.files[0];


if(!arquivo) return;


console.log("PDF selecionado:", arquivo.name);


resultado.innerHTML = 
"PDF selecionado: " + arquivo.name + "\n\nA ler PDF...";


try {


console.log("A chamar o leitor PDF...");


const texto = await lerPDF(arquivo);


console.log("Texto recebido:", texto);


if(texto && texto.trim() !== ""){


resultado.innerHTML = texto;


}else{


resultado.innerHTML =
"Nenhum texto encontrado no PDF";


}


}
catch(error){


console.log("Erro encontrado:", error);


resultado.innerHTML =
"Erro ao ler PDF: " + error.message;


}


});


</script>


</body>
  </html>
