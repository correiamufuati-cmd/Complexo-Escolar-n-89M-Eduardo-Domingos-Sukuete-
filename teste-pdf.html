<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Teste PDF</title>
</head>

<body>

<h2>Teste Leitor PDF</h2>

<input type="file" id="pdfFile" accept="application/pdf">

<pre id="resultado"></pre>


<script type="module">

import { lerPDF } from "./services/pdf-reader.js";


const input = document.getElementById("pdfFile");
const resultado = document.getElementById("resultado");


input.addEventListener("change", async()=>{


const arquivo = input.files[0];


if(!arquivo) return;


resultado.innerHTML =
"1 - PDF selecionado:\n" +
arquivo.name +
"\n\nTamanho: " +
arquivo.size +
" bytes";


try {


resultado.innerHTML += 
"\n\n2 - A chamar leitor PDF...";


const texto = await lerPDF(arquivo);


resultado.innerHTML += 
"\n\n3 - Leitura concluída\n\n";


resultado.innerHTML += 
texto || "Nenhum texto encontrado";


}
catch(error){


resultado.innerHTML +=
"\n\nERRO:\n" + error.message;


}


});


</script>


</body>
</html>
