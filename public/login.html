<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão Escolar</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f2f5fa;
        }

        form{
            width:350px;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 4px 12px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#1e3a8a;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:6px;
        }

        button{
            width:100%;
            padding:12px;
            background:#1e3a8a;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#163172;
        }
    </style>
</head>

<body>

<form id="loginForm">

    <h2>Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Senha"
        required
    >

    <button type="submit">
        Entrar
    </button>

</form>

<script type="module" src="../src/services/login.js"></script>

</body>
  </html>
