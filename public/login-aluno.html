<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login do Aluno</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#dff3ff,#1976d2);

}


.login-box{

    width:350px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);

}


h2{

    text-align:center;
    color:#1976d2;
    margin-bottom:25px;

}


input{

    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    color:#000;
    background:#fff;

}


input:focus{

    outline:none;
    border-color:#1976d2;

}


button{

    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#1976d2;
    color:white;
    font-size:16px;
    cursor:pointer;

}


button:hover{

    background:#0d47a1;

}


.voltar{

    text-align:center;
    margin-top:15px;

}


.voltar a{

    color:#1976d2;
    text-decoration:none;

}

</style>

</head>


<body>


<div class="login-box">


<form id="loginAluno">


<h2>👨‍🎓 Área do Aluno</h2>


<input
type="text"
id="codigoAluno"
name="codigoAluno"
placeholder="Código do aluno"
autocomplete="off"
required
>


<input
type="password"
id="senha"
name="senha"
placeholder="Senha"
autocomplete="off"
required
>


<button type="submit">
Entrar
</button>


<div class="voltar">

<a href="index.html">
Voltar
</a>

</div>


</form>


</div>



<script type="module" src="../src/services/student-login.js"></script>


</body>

    </html>
