<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login do Aluno</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#dff3ff,#1976d2);

}


forma {

    largura : 350 px ;
    fundo : branco ;
    preenchimento : 30 px ;
    raio da borda : 15 px ;
    box-shadow : 0  5 px  15 px  rgba ( 0 , 0 , 0 , .3 ) ;

}


h2 {

    alinhamento-do-texto : ao centro ;
    cor : #1976d2;
    margem-inferior : 25 px ;

}


entrada {

    largura : 100 % ;
    preenchimento : 12 px ;
    margem-inferior : 15 px ;
    borda : 1 px  sólida #ccc;
    raio da borda : 8 px ;
    tamanho da fonte : 16 px ;
    cor : #000;
    fundo : branco ;

}


entrada :: espaço reservado {

    cor : #777;

}


botão {

    largura : 100 % ;
    preenchimento : 12 px ;
    borda : nenhuma ;
    raio da borda : 8 px ;
    plano de fundo : #1976d2;
    cor : branca ;
    tamanho da fonte : 16 px ;
    cursor : ponteiro ;

}


botão : passar o mouse {

    plano de fundo : #0d47a1;

}

</ estilo >

</head>​​


< corpo >


< form  id = "loginAluno" >


< h2 > 👨‍🎓 Área do Aluno </ h2 >


< entrada 
tipo = "texto"
id = "codigoAluno"
placeholder = "Código do aluno"
obrigatório
>


< entrada
tipo = "senha"
id = "senha"
marcador de posição = "Senha"
obrigatório
>


< button  type = "submit" >
Entrar
</ botão >


</ formulário >

alert("HTML funcionando");
</script>
