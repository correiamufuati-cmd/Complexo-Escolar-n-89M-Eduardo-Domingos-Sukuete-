<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestão de Alunos</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
}

button{
background:#1976d2;
color:white;
border:none;
border-radius:5px;
}

.aluno{
background:#eee;
padding:10px;
margin-top:10px;
border-radius:5px;
}

  table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#1976d2;
    color:white;
}

tr:nth-child(even){
    background:#f2f2f2;
  }
  
</style>

</head>


<body>


<div class="container">


<h2>
Gestão de Alunos
</h2>


<label>
Selecionar Turma
</label>


<select id="turmaSelect">

<option>
Carregar turmas...
</option>

</select>



<input 
id="nomeAluno"
placeholder="Nome completo">



<input 
id="numeroAluno"
placeholder="Número">



<select id="sexoAluno">

<option value="">
Sexo
</option>

<option value="M">
Masculino
</option>

<option value="F">
Feminino
</option>

</select>



<input 
id="dataAluno"
placeholder="Data nascimento">



<button id="guardarAluno">

Guardar Aluno

</button>

<h3>Cadastro rápido de alunos</h3>

<p>
Cole a lista no formato:
<br>
Número;Nome;Sexo;Data
</p>

<textarea 
id="listaImportar"
placeholder="1;João Manuel;M;01-01-2010
2;Maria José;F;05-02-2011"
style="width:100%;height:150px;">
</textarea>

<button id="importarAlunos">
Importar Alunos
  </button>

<h3>
Lista de alunos
</h3>


<div id="listaAlunos">

  </div>


</div>


<h1>TESTE PÁGINA ALUNOS</h1>
  <script type="module" src="../services/students.js"></script>


</body>

  </html>
