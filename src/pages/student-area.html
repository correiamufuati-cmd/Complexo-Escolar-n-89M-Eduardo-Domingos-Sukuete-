<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Área do Aluno</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#dff3ff,#1976d2);
    padding:20px;
}


.container{
    max-width:900px;
    margin:auto;
}


.perfil{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 4px 10px #999;
}


.cards{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;

}


.card{

    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 10px #999;

}


.card button{

    width:100%;
    padding:12px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;

}


.card button:hover{

    background:#0d47a1;

}


.sair{

    margin-top:20px;
    padding:12px;
    background:#d32f2f;
    color:white;
    border:none;
    border-radius:8px;

}


</style>

</head>


<body>


<div class="container">


<h1>Área do Aluno</h1>

<p>Bem-vindo ao sistema escolar.</p>


<div class="perfil">

<h2 id="nomeAluno">
Carregando...
</h2>

<p id="codigo"></p>

<p id="turma"></p>

<p id="estado"></p>


</div>



<div class="cards">


<div class="card">

<h3>📊 Minhas Notas</h3>

<p>
Consultar avaliações
</p>

<button onclick="verNotas()">
Abrir
</button>

</div>



<div class="card">

<h3>📄 Meu Boletim</h3>

<p>
Consultar boletim
</p>

<button onclick="verBoletim()">
Abrir
</button>

</div>



<div class="card">

<h3>👤 Meus Dados</h3>

<p>
Informações pessoais
</p>

<button>
Ver
</button>

</div>



<div class="card">

<h3>🔑 Alterar Senha</h3>

<p>
Segurança da conta
</p>

<button>
Alterar
</button>

</div>


</div>


<button class="sair" onclick="sairAluno()">
Sair
</button>



</div>



<script type="module" src="../services/student-area.js"></script>


</body>

    </html>
