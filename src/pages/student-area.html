<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Área do Aluno - SGE</title><style>

/* =========================
   CONFIGURAÇÃO GERAL
========================= */

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{
    margin:0;
    background:#f1f5f9;
    color:#334155;
}



/* =========================
   CABEÇALHO
========================= */

header{
    background:#1e3a8a;
    color:white;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}


header h1{
    margin:0;
    font-size:25px;
}



/* =========================
   CONTAINER
========================= */

.container{
    width:95%;
    max-width:600px;
    margin:30px auto;
}



/* =========================
   CARTÃO
========================= */

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
}



/* =========================
   PERFIL
========================= */

.perfil{
    text-align:center;
    margin-bottom:25px;
}


.logo{
    font-size:65px;
    margin-bottom:10px;
}


#nomeAluno{
    color:#1e3a8a;
    margin:5px 0 15px;
    font-size:22px;
}


.dados{
    color:#475569;
    font-size:14px;
    line-height:1.9;
}


.dados div{
    margin:3px 0;
}



/* =========================
   MENU
========================= */

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:25px;
}


.menu button{
    padding:16px 10px;
    border:none;
    border-radius:10px;
    background:#1e3a8a;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
}


.menu button:hover{
    opacity:.9;
    transform:translateY(-1px);
}



/* =========================
   BOTÃO SAIR
========================= */

.btn-sair{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#dc2626;
    color:white;
    font-size:15px;
    cursor:pointer;
}


.btn-sair:hover{
    opacity:.9;
}



/* =========================
   RODAPÉ
========================= */

.info{
    margin-top:25px;
    text-align:center;
    font-size:13px;
    color:#64748b;
    line-height:1.6;
}



/* =========================
   RESPONSIVO
========================= */

@media(max-width:450px){

    .container{
        width:92%;
        margin:20px auto;
    }


    .card{
        padding:20px;
    }


    header h1{
        font-size:22px;
    }


    #nomeAluno{
        font-size:19px;
    }


    .menu{
        grid-template-columns:1fr;
    }

}

</style></head><body><!-- =========================
     CABEÇALHO
========================= --><header><h1>
    🎓 Área do Aluno
</h1>

</header><!-- =========================
     CONTEÚDO
========================= --><div class="container"><div class="card">


    <!-- PERFIL DO ALUNO -->

    <div class="perfil">


        <div class="logo">
            👨‍🎓
        </div>


        <h2 id="nomeAluno">
            Área do Aluno
        </h2>


        <div class="dados">


            <div id="codigo">
                Código: —
            </div>


            <div id="turma">
                Turma: —
            </div>


            <div id="estado">
                Estado: —
            </div>


        </div>

    </div>



    <!-- =========================
         MENU DO ALUNO
    ========================= -->

    <div class="menu">


        <button
            type="button"
            onclick="verNotas()">

            📊
            <br>
            Ver Notas

        </button>



        <button
            type="button"
            onclick="verBoletim()">

            📄
            <br>
            Ver Boletim

        </button>



        <button
            type="button"
            onclick="verDados()">

            👤
            <br>
            Meus Dados

        </button>



        <button
            type="button"
            onclick="alterarSenha()">

            🔐
            <br>
            Alterar Senha

        </button>


    </div>



    <!-- =========================
         SAIR
    ========================= -->

    <button
        type="button"
        class="btn-sair"
        onclick="sairAluno()">

        🚪 Sair da Conta

    </button>



    <!-- =========================
         INFORMAÇÃO
    ========================= -->

    <div class="info">

        SGE - Sistema de Gestão Escolar

        <br>

        Área exclusiva do aluno

    </div>


</div>

</div><!-- =========================
     JAVASCRIPT
========================= --><script
    type="module"
    src="../services/student-area.js?v=400">
</script></body></html>
