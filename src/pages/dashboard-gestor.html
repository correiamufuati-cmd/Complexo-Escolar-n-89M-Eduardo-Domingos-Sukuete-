<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Gestor</title>

  <link rel="stylesheet" href="../styles/dashboard.css">
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2 id="schoolName">Escola</h2>

    <a href="#">📊 Visão Geral</a>
    <a href="#">👨‍🎓 Alunos</a>
    <a href="#">👨‍🏫 Professores</a>
    <a href="#">🏫 Turmas</a>
    <a href="#">📚 Disciplinas</a>
    <a href="#">📝 Notas</a>
    <a href="#">📄 Boletins</a>
    <a href="#">⚙️ Definições</a>

    <button id="logoutBtn">Sair</button>
  </div>

  <!-- CONTEÚDO -->
  <div class="main">

    <header>
      <h1>Dashboard</h1>
      <p id="userInfo">Carregando...</p>
    </header>

    <!-- CARDS -->
    <div class="cards">

      <div class="card">
        <h3>Alunos</h3>
        <p id="totalStudents">0</p>
      </div>

      <div class="card">
        <h3>Professores</h3>
        <p id="totalTeachers">0</p>
      </div>

      <div class="card">
        <h3>Turmas</h3>
        <p id="totalClasses">0</p>
      </div>

    </div>

    <!-- ATIVIDADE -->
    <div class="section">
      <h2>Atividade recente</h2>
      <div id="activity">
        Nenhuma atividade ainda.
      </div>
    </div>

  </div>

  <script type="module" src="../services/dashboard-gestor.js"></script>
</body>
</html>
