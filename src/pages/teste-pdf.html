<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teste PDF</title>

</head>


<body>


<h2>Teste Leitor PDF</h2>


<input 
type="file" 
id="pdfFile" 
accept="application/pdf"
>


<pre id="resultado"></pre>



<script type="module">


import { lerPDF } from "../services/pdf-reader.js";


const input = document.getElementById("pdfFile");

const resultado = document.getElementById("resultado");


// teste de ligação

resultado.innerHTML = 
"pdf-reader carregado!";



input.addEventListener("change", async()=>{


const arquivo = input.files[0];


if(!arquivo){

return;

}



resultado.innerHTML =
"PDF selecionado:\n" +
arquivo.name +
"\n\nA iniciar leitura...";



try{


const texto = await lerPDF(arquivo);



resultado.innerHTML =

"Leitura concluída:\n\n" +

(texto || "Nenhum texto encontrado");


}

catch(erro){


resultado.innerHTML =

"Erro:\n" +

erro.message;


}



});



</script>



</body>

</html>
