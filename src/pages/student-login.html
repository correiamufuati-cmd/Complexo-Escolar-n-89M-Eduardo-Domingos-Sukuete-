<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Área do Aluno</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
}

.login{

    width:350px;
    margin:80px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);

}

input,button{

    width:100%;
    padding:12px;
    margin-top:10px;

}

button{

    background:#1976d2;
    color:white;
    border:none;
    border-radius:5px;

}

</style>

</head>


<body>


<div class="login">


<h2>Área do Aluno</h2>


<form id="loginAluno">


<input
id="codigoAluno"
placeholder="Código do aluno"
required>


<input
type="password"
id="senhaAluno"
placeholder="Senha"
required>


<button type="submit">

Entrar

</button>


</form>


</div>



<script type="module" src="../services/student-login.js?v=2"></script>


</body>

    </html>
