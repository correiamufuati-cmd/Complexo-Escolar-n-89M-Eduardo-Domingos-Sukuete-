<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Área do Aluno - SGE</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =====================================================
   BODY
===================================================== */

body {
    margin: 0;
    background: #f1f5f9;
}


/* =====================================================
   CABEÇALHO
===================================================== */

header {

    background: #1e3a8a;

    color: white;

    padding: 20px;

    text-align: center;

    box-shadow:
        0 2px 8px rgba(0,0,0,.2);
}


header h1 {

    margin: 0;

    font-size: 25px;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    width: 95%;

    max-width: 450px;

    margin: 40px auto;

}


/* =====================================================
   CARTÃO
===================================================== */

.card {

    background: white;

    padding: 25px;

    border-radius: 15px;

    box-shadow:
        0 4px 12px rgba(0,0,0,.12);

}


/* =====================================================
   LOGO
===================================================== */

.logo {

    text-align: center;

    font-size: 50px;

    margin-bottom: 10px;

}


/* =====================================================
   TÍTULO
===================================================== */

h2 {

    text-align: center;

    color: #1e3a8a;

    margin-bottom: 20px;

}


/* =====================================================
   LABELS
===================================================== */

label {

    font-weight: bold;

    color: #334155;

    display: block;

    margin-top: 15px;

}


/* =====================================================
   INPUTS
===================================================== */

input {

    width: 100%;

    padding: 12px;

    margin-top: 6px;

    border:
        1px solid #cbd5e1;

    border-radius: 8px;

    font-size: 15px;

}


input:focus {

    outline: none;

    border-color: #1e3a8a;

}


/* =====================================================
   BOTÃO
===================================================== */

button {

    width: 100%;

    padding: 13px;

    margin-top: 25px;

    background: #1e3a8a;

    color: white;

    border: none;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;

}


button:hover {

    opacity: .9;

}


/* =====================================================
   INFORMAÇÃO
===================================================== */

.info {

    margin-top: 20px;

    text-align: center;

    font-size: 13px;

    color: #64748b;

}

</style>

</head>


<body>


<!-- ===================================================
     CABEÇALHO
=================================================== -->

<header>

    <h1>
        🎓 Área do Aluno
    </h1>

</header>


<!-- ===================================================
     CONTEÚDO
=================================================== -->

<div class="container">


    <div class="card">


        <div class="logo">
            👨‍🎓
        </div>


        <h2>
            Entrar no Sistema
        </h2>


        <!-- =========================================
             FORMULÁRIO
        ========================================== -->

        <form id="loginAluno">


            <label>
                Código do Aluno
            </label>


            <input

                id="codigoAluno"

                type="text"

                placeholder="Digite o código do aluno"

                autocomplete="off"

                required

            >


            <label>
                Senha
            </label>


            <input

                id="senhaAluno"

                type="password"

                placeholder="Digite a senha"

                required

            >


            <button type="submit">

                🔐 Entrar

            </button>


        </form>


        <!-- =========================================
             INFORMAÇÃO
        ========================================== -->

        <div class="info">

            SGE - Sistema de Gestão Escolar

            <br>

            Acesso exclusivo aos alunos

        </div>


    </div>

</div>


<!-- ===================================================
     TESTE HTML
=================================================== -->

alert(
    "HTML DO LOGIN CARREGOU ✅"
);

</script>

     JAVASCRIPT DO LOGIN
=================================================== -->

</script>


</body>

    </html>
