<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mini-Pauta - Professor</title>

<link
    rel="stylesheet"
    href="../styles/dashboard.css"
>

<style>

    *{
        box-sizing:border-box;
    }

    body{
        margin:0;
        background:#f1f5f9;
        font-family:Arial,Helvetica,sans-serif;
        color:#1e293b;
    }

    .main{
        width:100%;
        padding:25px;
    }

    .cabecalho{
        background:
            linear-gradient(
                135deg,
                #1e3a8a,
                #2563eb
            );

        color:white;

        padding:25px;

        border-radius:18px;

        margin-bottom:20px;

        box-shadow:
            0 5px 18px
            rgba(0,0,0,.12);
    }

    .cabecalho h1{
        margin:0 0 8px;
        font-size:26px;
    }

    .cabecalho p{
        margin:0;
        opacity:.9;
    }

    .info-professor{
        margin-top:15px;

        display:flex;

        flex-wrap:wrap;

        gap:10px;
    }

    .info-professor span{
        background:
            rgba(255,255,255,.15);

        padding:7px 12px;

        border-radius:20px;

        font-size:13px;
    }

    .section{
        background:white;

        padding:20px;

        border-radius:16px;

        margin-bottom:20px;

        box-shadow:
            0 3px 12px
            rgba(0,0,0,.07);
    }

    .section h2{
        margin-top:0;

        color:#1e3a8a;

        font-size:20px;
    }

    .controlos{
        display:grid;

        grid-template-columns:
            repeat(
                3,
                minmax(180px,1fr)
            );

        gap:15px;
    }

    .campo{
        display:flex;

        flex-direction:column;

        gap:7px;
    }

    .campo label{
        font-weight:bold;

        color:#1e3a8a;
    }

    select{
        width:100%;

        padding:12px;

        border:
            1px solid
            #cbd5e1;

        border-radius:9px;

        background:white;

        font-size:15px;
    }

    .estado{
        display:flex;

        justify-content:space-between;

        align-items:center;

        gap:15px;

        flex-wrap:wrap;

        margin-top:18px;

        padding:14px;

        border-radius:10px;

        background:#f8fafc;

        border:
            1px solid
            #e2e8f0;
    }

    .estado-texto{
        font-weight:bold;
    }

    .estado-aberto{
        color:#15803d;
    }

    .estado-bloqueado{
        color:#dc2626;
    }

    .estado-fechado{
        color:#7c3aed;
    }

    .tabela-container{
        width:100%;

        overflow-x:auto;
    }

    table{
        width:100%;

        min-width:750px;

        border-collapse:collapse;
    }

    th{
        background:#1e3a8a;

        color:white;

        padding:11px;

        border:
            1px solid
            #cbd5e1;

        text-align:center;
    }

    td{
        border:
            1px solid
            #cbd5e1;

        padding:8px;

        text-align:center;
    }

    td.nome{
        text-align:left;

        min-width:250px;

        font-weight:bold;
    }

    input.nota{
        width:80px;

        padding:8px;

        border:
            1px solid
            #cbd5e1;

        border-radius:7px;

        text-align:center;

        font-size:15px;
    }

    input.nota:focus{
        outline:none;

        border-color:#2563eb;
    }

    .mf{
        font-weight:bold;

        background:#f0fdf4;

        color:#166534;
    }

    .mf-reprovado{
        color:#dc2626;

        background:#fef2f2;
    }

    .acoes{
        display:flex;

        gap:10px;

        flex-wrap:wrap;

        margin-top:20px;
    }

    button{
        border:0;

        border-radius:9px;

        padding:11px 18px;

        cursor:pointer;

        font-weight:bold;

        font-size:14px;
    }

    #saveGrades{
        background:#2563eb;

        color:white;
    }

    #saveGrades:hover{
        background:#1d4ed8;
    }

    #limparNotas{
        background:#e2e8f0;

        color:#1e293b;
    }

    .botao-bloqueado{
        opacity:.5;

        cursor:not-allowed !important;
    }

    .mensagem{
        padding:15px;

        border-radius:10px;

        margin-top:15px;

        display:none;

        font-weight:bold;
    }

    .mensagem.erro{
        display:block;

        background:#fef2f2;

        color:#b91c1c;
    }

    .mensagem.sucesso{
        display:block;

        background:#f0fdf4;

        color:#166534;
    }

    .mensagem.aviso{
        display:block;

        background:#fffbeb;

        color:#92400e;
    }

    @media(max-width:800px){

        .main{
            padding:12px;
        }

        .cabecalho{
            padding:20px;
        }

        .cabecalho h1{
            font-size:22px;
        }

        .controlos{
            grid-template-columns:1fr;
        }

    }

    @media print{

        body{
            background:white;
        }

        .cabecalho{
            color:black;

            background:white;

            box-shadow:none;

            border:1px solid #ddd;
        }

        .controlos,
        .acoes,
        .estado{
            display:none;
        }

        .section{
            box-shadow:none;
        }

    }

</style>

</head><body><div class="main"><!-- ==========================================
     CABEÇALHO
=========================================== -->

<div class="cabecalho">

    <h1>
        📝 Mini-Pauta
    </h1>

    <p>
        Lançamento de notas do professor
    </p>

    <div class="info-professor">

        <span id="professorInfo">
            Professor: —
        </span>

        <span id="classeInfo">
            Classe: —
        </span>

        <span id="turmaInfo">
            Turma: —
        </span>

    </div>

</div>



<!-- ==========================================
     SELEÇÃO
=========================================== -->

<div class="section">

    <h2>
        Seleção da Pauta
    </h2>


    <div class="controlos">


        <div class="campo">

            <label for="classSelect">
                Turma
            </label>

            <select id="classSelect">

                <option value="">
                    Selecionar turma
                </option>

            </select>

        </div>



        <div class="campo">

            <label for="subject">
                Disciplina
            </label>

            <select id="subject">

                <option value="">
                    Selecionar disciplina
                </option>

            </select>

        </div>



        <div class="campo">

            <label for="trimestre">
                Trimestre
            </label>

            <select id="trimestre">

                <option value="">
                    Selecionar trimestre
                </option>

                <option value="1">
                    1.º Trimestre
                </option>

                <option value="2">
                    2.º Trimestre
                </option>

                <option value="3">
                    3.º Trimestre
                </option>

            </select>

        </div>

    </div>


    <div class="estado">

        <span
            id="estadoTexto"
            class="estado-texto"
        >
            Selecione a turma, disciplina e trimestre.
        </span>

        <span id="estadoIcone">
            ⏳
        </span>

    </div>

</div>



<!-- ==========================================
     LANÇAMENTO
=========================================== -->

<div class="section">

    <h2>
        Lançamento de Notas
    </h2>


    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <div class="tabela-container">

        <table>

            <thead>

                <tr>

                    <th>
                        Nº
                    </th>

                    <th>
                        Nome Completo
                    </th>

                    <th>
                        MAC
                    </th>

                    <th>
                        NPT
                    </th>

                    <th>
                        MF
                    </th>

                </tr>

            </thead>


            <tbody id="pautaBody">

                <tr>

                    <td
                        colspan="5"
                    >

                        Selecione os dados
                        acima para carregar
                        os alunos.

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <div class="acoes">

        <button
            id="saveGrades"
            type="button"
        >

            💾 Guardar Mini-Pauta

        </button>


        <button
            id="limparNotas"
            type="button"
        >

            🧹 Limpar

        </button>

    </div>

</div>

</div><script
    type="module"
    src="./services/grades.js?v=200"></script>

</body>

</html>
