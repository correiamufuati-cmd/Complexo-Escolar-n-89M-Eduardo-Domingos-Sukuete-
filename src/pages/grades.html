<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Notas</title>
    <link rel="stylesheet" href="../styles/dashboard.css">
</head>

<body>

<div class="main">

    <h1>Gestão de Notas</h1>


    <div class="section">

        <h2>Lançar Nota</h2>


        <label>Turma</label>
        <select id="classSelect">
            <option value="">Selecionar turma</option>
        </select>


        <label>Disciplina</label>
        <input 
            type="text" 
            id="subject"
            placeholder="Ex: Matemática"
        >


        <label>Aluno</label>
        <select id="studentSelect">
            <option value="">Selecionar aluno</option>
        </select>


        <label>Nota</label>
        <input 
            type="number"
            id="gradeValue"
            min="0"
            max="20"
            placeholder="Nota 0-20"
        >


        <button id="saveGrade">
            Guardar Nota
        </button>


    </div>



    <div class="section">

        <h2>Notas lançadas</h2>

        <div id="gradesList"></div>

    </div>


</div>



<script type="module" src="../services/grades.js"></script>


</body>
      </html>
