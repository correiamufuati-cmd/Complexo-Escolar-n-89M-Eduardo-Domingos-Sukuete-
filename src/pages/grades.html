<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<title>Mini-Pauta</title>

<link rel="stylesheet" href="../styles/dashboard.css">

<style>

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#1976d2;
    color:white;
    padding:8px;
}

td{
    border:1px solid #ddd;
    padding:6px;
}

input{
    width:80px;
    padding:5px;
}

select{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    padding:10px;
    margin-top:15px;
}

textarea{
    width:100%;
    height:150px;
}

</style>

</head>


<body>


<div class="main">


<h1>
Gestão de Notas - Mini Pauta
</h1>



<div class="section">


<label>
Turma
</label>


<select id="classSelect">

<option>
Selecionar turma
</option>

</select>




<label>
Disciplina
</label>


<select id="subject">

<option>
Selecionar disciplina
</option>

</select>



</div>




<div class="section">


<h2>
Lançamento de Notas
</h2>



<table>


<thead>

<tr>

<th>Nº</th>

<th>Nome</th>

<th>MAC</th>

<th>NPT</th>

<th>MF</th>

</tr>

</thead>



<tbody id="pautaBody">


</tbody>



</table>



<button id="saveGrades">

Guardar Mini-Pauta

</button>



</div>





<div class="section">


<h2>
Importar do Excel
</h2>


<p>
Formato:
<br>
Número;Nome;MAC;NPT
</p>


<textarea id="excelInput"></textarea>



<button id="importExcel">

Importar Notas

</button>


</div>





<div id="gradesList"></div>


</div>



<script type="module" src="../services/grades.js"></script>


</body>

    </html>
