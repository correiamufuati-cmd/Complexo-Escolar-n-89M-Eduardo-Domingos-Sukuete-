<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gestão de Turmas</title>


<style>

body{

    font-family: Arial, sans-serif;
    padding:20px;
    background:#f5f7fa;

}


.container{

    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;

}


h2{

    text-align:center;

}



input, select, button{

    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;

}



button{

    background:#1976d2;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;

}



button:hover{

    opacity:0.8;

}



.turma-card{

    background:#eeeeee;
    padding:15px;
    margin-top:15px;
    border-radius:8px;

}



</style>


</head>


<body>



<div class="container">


<h2>
Gestão de Turmas
</h2>



<label>
Nome da Turma
</label>

<input 
id="className"
placeholder="Ex: 7ª A">



<label>
Classe
</label>

<input 
id="classe"
placeholder="Ex: 7ª">



<label>
Ano Lectivo
</label>

<input 
id="anoLetivo"
placeholder="Ex: 2026/2027">





<button id="saveClass">

Criar Turma

</button>




<h3>
Turmas Criadas
</h3>



<div id="classList">

A carregar...

</div>



</div>




<script type="module" src="services/classes.js"></script>

</body>

  </html>
