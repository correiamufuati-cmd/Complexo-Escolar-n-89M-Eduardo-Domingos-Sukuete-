<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Turmas</title>
  <link rel="stylesheet" href="../styles/dashboard.css">
</head>

<body>

  <div class="main">

    <h1>Gestão de Turmas</h1>

    <!-- FORMULÁRIO -->
    <div class="section">
      <h2>Criar Turma</h2>

      <input type="text" id="name" placeholder="Nome da turma (ex: 10A)">
      <input type="text" id="level" placeholder="Classe (ex: 10ª classe)">

      <button id="addBtn">Adicionar</button>
    </div>

    <!-- LISTA -->
    <div class="section">
      <h2>Lista de Turmas</h2>
      <div id="classesList"></div>
    </div>

  </div>

  <script type="module" src="../services/classes.js"></script>

</body>
</html>
