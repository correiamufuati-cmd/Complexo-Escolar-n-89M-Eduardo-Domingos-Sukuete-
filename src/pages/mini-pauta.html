<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini-Pauta - SGE</title>


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}



body{

margin:0;
background:#f1f5f9;

}



header{

background:#1e3a8a;
color:white;
padding:20px;
text-align:center;

}



.container{

width:95%;
max-width:1100px;
margin:20px auto;

}



.card{

background:white;
padding:15px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.1);

}



#info{

color:#1e3a8a;
font-weight:bold;
margin-bottom:15px;
font-size:15px;

}




table{

width:100%;
border-collapse:collapse;
font-size:13px;

}



thead{

background:#1e3a8a;
color:white;

}



th{

padding:8px;

}



td{

padding:5px;
border-bottom:1px solid #ddd;
text-align:center;

}



tr:hover{

background:#e0f2fe;

}




/* COLUNAS */


.numero{

width:35px;

}



.nome{

width:45%;
text-align:left;

}



.sexo{

width:35px;

}



.nota{

width:45px;

}



.classificacao{

width:90px;

}





input{

width:45px;
padding:4px;
border:1px solid #aaa;
border-radius:5px;
text-align:center;

}



input:focus{

border-color:#1e3a8a;
outline:none;

}




#guardarNotas{

width:100%;
padding:12px;
background:#1e3a8a;
color:white;
border:none;
border-radius:8px;
font-size:16px;
margin-top:15px;
cursor:pointer;

}



#guardarNotas:hover{

opacity:.9;

}





</style>


</head>



<body>



<header>

<h1>
📋 Mini-Pauta
</h1>

</header>





<div class="container">


<div class="card">



<div id="info">

Carregando...

</div>





<table>


<thead>


<tr>


<th class="numero">

Nº

</th>



<th class="nome">

Nome

</th>




<th class="sexo">

Sexo

</th>




<th class="nota">

MAC

</th>




<th class="nota">

NPT

</th>




<th class="nota">

MF

</th>




<th class="classificacao">

Class.

</th>



</tr>



</thead>





<tbody id="listaAlunos">


</tbody>




</table>





<button id="guardarNotas">

💾 Guardar Notas

</button>




</div>


</div>







<script type="module" src="../services/mini-pauta.js?v=2"></script>




</body>


  </html>
