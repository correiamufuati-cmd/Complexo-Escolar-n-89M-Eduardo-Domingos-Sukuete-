<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alterar Senha</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    padding:20px;
}

.container{

    max-width:400px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;

}

input,button{

    width:100%;
    padding:12px;
    margin-top:10px;

}

button{

    background:#1976d2;
    color:white;
    border:none;
    border-radius:6px;

}

</style>

</head>

<body>


<div class="container">

<h2>🔑 Alterar Senha</h2>


<input 
type="password"
placeholder="Nova senha"
id="novaSenha"
>


<button onclick="guardarSenha()">
Guardar
</button>


<button onclick="voltar()">
Voltar
</button>


</div>



<script>


function guardarSenha(){

let senha =
document.getElementById("novaSenha").value;


if(!senha){

alert("Digite uma senha");

return;

}


alert("Senha preparada para atualização");


}



function voltar(){

history.back();

}


</script>


</body>

  </html>
