<title>Área Financeira - SIGEA</title><link
    rel="stylesheet"
    href="../styles/dashboard.css"
><style>

/* =====================================================
   CONTAINER
===================================================== */

.financeiro-container{

    padding:25px;

}


/* =====================================================
   CABEÇALHO
===================================================== */

.financeiro-header{

    background:linear-gradient(
        135deg,
        #1e3a8a,
        #2563eb
    );

    color:white;

    padding:25px;

    border-radius:18px;

    margin-bottom:25px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.12);

}

.financeiro-header-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;

}

.financeiro-header h1{

    margin:0 0 8px;

}

.financeiro-header p{

    margin:0;

}


/* =====================================================
   BOTÃO ALTERAR SENHA
===================================================== */

#alterarSenhaBtn{

    background:white;

    color:#1e3a8a;

    border:none;

    padding:11px 16px;

    border-radius:9px;

    font-weight:bold;

    cursor:pointer;

}

#alterarSenhaBtn:hover{

    opacity:.9;

}


/* =====================================================
   PAINEL ALTERAR SENHA
===================================================== */

#painelSenha{

    display:none;

    background:white;

    padding:20px;

    border-radius:16px;

    margin-bottom:20px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.07);

}

#painelSenha h2{

    margin-top:0;

    color:#1e3a8a;

}

#painelSenha input{

    width:100%;

    box-sizing:border-box;

    padding:12px;

    margin-bottom:12px;

    border:1px solid #cbd5e1;

    border-radius:9px;

}

.botoes-senha{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}

#guardarSenhaBtn{

    background:#2563eb;

    color:white;

    border:none;

    padding:11px 18px;

    border-radius:9px;

    cursor:pointer;

    font-weight:bold;

}

#cancelarSenhaBtn{

    background:#e2e8f0;

    color:#334155;

    border:none;

    padding:11px 18px;

    border-radius:9px;

    cursor:pointer;

    font-weight:bold;

}


/* =====================================================
   CONTROLES
===================================================== */

.controles{

    background:white;

    padding:20px;

    border-radius:16px;

    margin-bottom:20px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.07);

}

.controles label{

    display:block;

    margin-bottom:7px;

    font-weight:bold;

}

.controles select{

    width:100%;

    padding:12px;

    border:1px solid #cbd5e1;

    border-radius:9px;

    margin-bottom:15px;

}


/* =====================================================
   TABELA
===================================================== */

.tabela-container{

    background:white;

    padding:15px;

    border-radius:16px;

    overflow-x:auto;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.07);

}

table{

    width:100%;

    min-width:900px;

    border-collapse:collapse;

}

th{

    background:#e0f2fe;

    color:#1e3a8a;

    padding:12px;

    border:1px solid #cbd5e1;

}

td{

    padding:10px;

    border:1px solid #cbd5e1;

    text-align:center;

}

td.nome{

    text-align:left;

    font-weight:bold;

}


/* =====================================================
   PAGAMENTOS
===================================================== */

.pagamento-btn{

    border:none;

    border-radius:8px;

    padding:8px 12px;

    cursor:pointer;

    font-weight:bold;

}

.pago{

    background:#dcfce7;

    color:#166534;

}

.nao-pago{

    background:#fee2e2;

    color:#991b1b;

}


/* =====================================================
   COMUNICADO
===================================================== */

.comunicado{

    width:180px;

    padding:8px;

    border:1px solid #cbd5e1;

    border-radius:7px;

}

</style></head><body><div class="financeiro-container"><!-- =================================================
     CABEÇALHO
================================================== -->

<div class="financeiro-header">

    <div class="financeiro-header-top">

        <div>

            <h1>
                💰 Área Financeira
            </h1>

            <p>
                Gestão de propinas e liberação dos boletins
            </p>

        </div>


        <button
            type="button"
            id="alterarSenhaBtn"
        >

            🔑 Alterar senha

        </button>

    </div>

</div>


<!-- =================================================
     PAINEL ALTERAR SENHA
================================================== -->

<div id="painelSenha">

    <h2>
        🔐 Alterar senha financeira
    </h2>

    <input
        type="password"
        id="senhaAtual"
        placeholder="Senha atual"
        autocomplete="current-password"
    >

    <input
        type="password"
        id="novaSenha"
        placeholder="Nova senha"
        autocomplete="new-password"
    >

    <input
        type="password"
        id="confirmarSenha"
        placeholder="Confirmar nova senha"
        autocomplete="new-password"
    >

    <div class="botoes-senha">

        <button
            type="button"
            id="guardarSenhaBtn"
        >

            💾 Guardar nova senha

        </button>


        <button
            type="button"
            id="cancelarSenhaBtn"
        >

            Cancelar

        </button>

    </div>

</div>


<!-- =================================================
     CONTROLES
================================================== -->

<div class="controles">

    <label>
        Selecionar Turma
    </label>

    <select id="turmaSelect">

        <option value="">
            -- Selecione uma turma --
        </option>

    </select>

</div>


<!-- =================================================
     TABELA
================================================== -->

<div class="tabela-container">

    <table>

        <thead>

            <tr>

                <th>Nº</th>

                <th>Aluno</th>

                <th>Idade</th>

                <th>1.º Trimestre</th>

                <th>2.º Trimestre</th>

                <th>3.º Trimestre</th>

                <th>Comunicado</th>

            </tr>

        </thead>


        <tbody id="financeiroLista">

            <tr>

                <td colspan="7">

                    Selecione uma turma.

                </td>

            </tr>

        </tbody>

    </table>

</div>

</div><script
    type="module"
    src="../services/financeiro.js?v=11"></script>

</body>

</html>
