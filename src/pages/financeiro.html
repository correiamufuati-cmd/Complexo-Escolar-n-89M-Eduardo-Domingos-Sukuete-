<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Área Financeira - SIGEA</title>

<link
    rel="stylesheet"
    href="../styles/dashboard.css"
>

<style>

.financeiro-container{

    padding:25px;

}

.financeiro-header{

    background:linear-gradient(
        135deg,
        #1e3a8a,
        #2563eb
    );

    color:white;

    padding:25px;

    border-radius:18px;

    margin-bottom:25px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.12);

}

.financeiro-header h1{

    margin:0 0 8px;

}

.controles{

    background:white;

    padding:20px;

    border-radius:16px;

    margin-bottom:20px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.07);

}

.controles label{

    display:block;

    margin-bottom:7px;

    font-weight:bold;

}

.controles select{

    width:100%;

    padding:12px;

    border:1px solid #cbd5e1;

    border-radius:9px;

    margin-bottom:15px;

}

.tabela-container{

    background:white;

    padding:15px;

    border-radius:16px;

    overflow-x:auto;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.07);

}

table{

    width:100%;

    min-width:900px;

    border-collapse:collapse;

}

th{

    background:#e0f2fe;

    color:#1e3a8a;

    padding:12px;

    border:1px solid #cbd5e1;

}

td{

    padding:10px;

    border:1px solid #cbd5e1;

    text-align:center;

}

td.nome{

    text-align:left;

    font-weight:bold;

}

.pagamento-btn{

    border:none;

    border-radius:8px;

    padding:8px 12px;

    cursor:pointer;

    font-weight:bold;

}

.pago{

    background:#dcfce7;

    color:#166534;

}

.nao-pago{

    background:#fee2e2;

    color:#991b1b;

}

.comunicado{

    width:180px;

    padding:8px;

    border:1px solid #cbd5e1;

    border-radius:7px;

}

</style>

</head>


<body>


<div class="financeiro-container">


    <div class="financeiro-header">

        <h1>
            💰 Área Financeira
        </h1>

        <p>
            Gestão de propinas e liberação dos boletins
        </p>

    </div>


    <div class="controles">

        <label>
            Selecionar Turma
        </label>

        <select id="turmaSelect">

            <option value="">
                -- Selecione uma turma --
            </option>

        </select>

    </div>


    <div class="tabela-container">

        <table>

            <thead>

                <tr>

                    <th>Nº</th>

                    <th>Aluno</th>

                    <th>Idade</th>

                    <th>1.º Trimestre</th>

                    <th>2.º Trimestre</th>

                    <th>3.º Trimestre</th>

                    <th>Comunicado</th>

                </tr>

            </thead>

            <tbody id="financeiroLista">

                <tr>

                    <td colspan="7">

                        Selecione uma turma.

                    </td>

                </tr>

            </tbody>

        </table>

    </div>


</div>


<script
    type="module"
    src="../services/financeiro.js?v=1"
></script>


</body>

        </html>
