<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Área do Professor</title>


<style>

body{

font-family: Arial, sans-serif;

padding:20px;

background:#f1f5f9;

}


.container{

max-width:600px;

margin:auto;

}


h1{

text-align:center;

color:#1e3a8a;

}


.card{

background:white;

border:1px solid #ccc;

padding:20px;

border-radius:10px;

margin-top:20px;

box-shadow:0 3px 10px rgba(0,0,0,0.1);

}


label{

display:block;

margin-top:15px;

font-weight:bold;

}


select,
button{

width:100%;

padding:12px;

margin-top:8px;

font-size:16px;

}


select{

border-radius:5px;

border:1px solid #aaa;

}


button{

background:#1976d2;

color:white;

border:none;

border-radius:5px;

cursor:pointer;

}


button:hover{

opacity:0.8;

}


</style>


</head>



<body>



<div class="container">



<h1>
👨‍🏫 Área do Professor
</h1>



<div class="card">



<h2 id="nomeProfessor">

Carregando...

</h2>



<p>

Selecione a turma e a disciplina para trabalhar.

</p>




<label>
Turma:
</label>


<select id="selectTurma">

<option value="">
Selecione a turma
</option>


</select>





<label>
Disciplina:
</label>


<select id="selectDisciplina">

<option value="">
Selecione a disciplina
</option>


</select>




<br><br>



<button id="abrirMiniPauta">

📋 Abrir Mini-Pauta

</button>



</div>



</div>





<script type="module" src="../services/login-professor.js?v=2"></script>



</body>


</html>
