<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Área do Professor - SGE</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
margin:0;
background:#f1f5f9;
}


header{

background:#1e3a8a;
color:white;
padding:25px;
text-align:center;

}


.container{

max-width:400px;
margin:40px auto;
padding:20px;

}


.card{

background:white;
padding:25px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.1);

}


h2{

text-align:center;
color:#1e3a8a;

}


label{

display:block;
margin-top:15px;
font-weight:bold;

}


input{

width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;

}


button{

width:100%;
padding:13px;
margin-top:25px;
background:#1e3a8a;
color:white;
border:none;
border-radius:8px;
font-size:16px;

}


</style>

</head>


<body>


<header>

<h1>SGE</h1>

<p style="color:white">
Sistema de Gestão Escolar
</p>

</header>


<div class="container">


<div class="card">


<h2>
👨‍🏫 Área do Professor
</h2>


<label>
Código do Professor
</label>

<input 
id="codigo"
placeholder="Digite o código">


<label>
Senha
</label>

<input 
id="senha"
type="password"
placeholder="Digite a senha">


<button id="entrar">

Entrar

</button>


</div>


</div>


<script type="module" src="../services/login-professor.js"></script>


</body>

  </html>
