<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<title>Gestão de Professores</title>

<link rel="stylesheet" href="../styles/dashboard.css">

<style>

.checkBox{
padding:8px;
border:1px solid #ddd;
margin:5px;
border-radius:5px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#1976d2;
color:white;
padding:8px;
}

td{
border:1px solid #ddd;
padding:8px;
}

button{
padding:8px;
}

</style>

</head>


<body>


<div class="main">


<h1>
Gestão de Professores
</h1>



<div class="section">


<h2>
Cadastrar Professor
</h2>



<input 
id="nomeProfessor"
placeholder="Nome do professor">



<input 
id="emailProfessor"
placeholder="Email">



<label>
Nível de Ensino
</label>


<select id="nivelEnsino">

<option value="">
Selecionar nível
</option>

<option value="ensinoPrimario">
Ensino Primário
</option>


<option value="primeiroCiclo">
Primeiro Ciclo
</option>


</select>



<h3>
Disciplinas
</h3>


<div id="listaDisciplinas">

Selecione o nível

</div>




<h3>
Turmas
</h3>


<div id="listaTurmas">

Selecione o nível

</div>



<br>


<button id="guardarProfessor">

Guardar Professor

</button>


</div>






<div class="section">


<h2>
Lista de Professores
</h2>



<table>


<thead>

<tr>

<th>Código</th>

<th>Nome</th>

<th>Email</th>

<th>Ensino</th>

<th>Disciplinas</th>

<th>Turmas</th>

<th>Estado</th>

<th>Ações</th>


</tr>

</thead>


<tbody id="tabelaProfessores">


</tbody>


</table>


</div>




</div>



<script 
type="module"
src="../services/teachers.js">
</script>



</body>

  </html>
