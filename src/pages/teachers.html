<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<title>Gestão de Professores</title>

<link rel="stylesheet" href="../styles/dashboard.css">

</head>


<body>


<div class="main">


<h1>Gestão de Professores</h1>



<div class="section">


<h2>Cadastrar Professor</h2>


<input 
id="nomeProfessor"
placeholder="Nome do professor">



<input 
id="emailProfessor"
placeholder="Email">



<h3>Selecionar Turmas</h3>

<select 
id="turmasProfessor"
multiple
style="height:150px;width:100%;">

</select>



<h3>Selecionar Disciplinas</h3>

<select 
id="disciplinasProfessor"
multiple
style="height:150px;width:100%;">

</select>



<button id="guardarProfessor">

Guardar Professor

</button>



</div>





<div class="section">


<h2>Lista de Professores</h2>


<div id="listaProfessores"></div>


</div>




</div>



<script 
type="module"
src="../services/teachers.js">

</script>



</body>

  </html>
