<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<title>Gestão de Professores</title>

<link rel="stylesheet" href="../styles/dashboard.css">

</head>


<body>


<div class="main">


<h1>Gestão de Professores</h1>



<div class="section">


<h2>Cadastrar Professor</h2>



<label>Nome</label>

<input 
type="text"
id="nomeProfessor"
placeholder="Nome do professor">



<label>Email</label>

<input 
type="email"
id="emailProfessor"
placeholder="Email">





<label>Nível de Ensino</label>

<select id="nivelEnsino">

<option value="">
Selecionar nível
</option>


<option value="ensinoPrimario">
Ensino Primário
</option>


<option value="primeiroCiclo">
Primeiro Ciclo
</option>


</select>





<h3>Turmas</h3>


<div id="listaTurmas">

Selecione o nível

</div>






<h3>Disciplinas por turma</h3>


<div id="listaAtribuicoes">

Selecione as turmas

</div>







<button id="guardarProfessor">

Guardar Professor

</button>




</div>









<div class="section">


<h2>Lista de Professores</h2>


<table>


<thead>

<tr>

<th>Código</th>

<th>Nome</th>

<th>Email</th>

<th>Ensino</th>

<th>Atribuições</th>

<th>Senha</th>

<th>Ações</th>


</tr>


</thead>



<tbody id="tabelaProfessores">


</tbody>



</table>



</div>






</div>





<script 
type="module"
src="../services/teachers.js">

</script>



</body>

  </html>
