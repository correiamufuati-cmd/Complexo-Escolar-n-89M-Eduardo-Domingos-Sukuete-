<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Gestor - SGE</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f1f5f9;

}



form{

    width:350px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);

}



h2{

    text-align:center;
    color:#1e3a8a;
    margin-bottom:20px;

}



input{

    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;

}



button{

    width:100%;
    padding:12px;
    background:#1e3a8a;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;

}



button:hover{

    background:#163172;

}


</style>


</head>


<body>



<form id="loginForm">


<h2>
Área do Gestor
</h2>



<input

type="email"

id="email"

placeholder="Email"

required

>



<input

type="password"

id="password"

placeholder="Senha"

required

>



<button type="submit">

Entrar

</button>



</form>




<script type="module" src="../services/gestor-login.js"></script>



</body>

    </html>
