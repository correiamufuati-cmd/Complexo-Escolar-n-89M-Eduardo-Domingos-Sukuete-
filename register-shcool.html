<form id="schoolForm">

  <h2>Criar Escola</h2>

  <input type="text" id="schoolName" placeholder="Nome da escola" required />
  <input type="text" id="address" placeholder="Endereço" required />

  <hr />

  <h3>Dados do Gestor</h3>

  <input type="text" id="adminName" placeholder="Nome do gestor" required />
  <input type="email" id="email" placeholder="Email" required />
  <input type="password" id="password" placeholder="Senha" required />

  <button type="submit">Criar Escola</button>

</form>

<script type="module" src="register-school.js"></script>
