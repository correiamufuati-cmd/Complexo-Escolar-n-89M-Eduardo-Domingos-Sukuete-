<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sistema Escolar</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f2f2f2}
nav{background:#1e88e5;color:white;padding:10px}
nav button{margin-right:10px}
.section{display:none;padding:15px}
.card{background:white;padding:10px;margin:10px 0;border-radius:5px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ccc;padding:5px;text-align:left}
</style>
</head>

<body>

<nav>
<button onclick="mostrar('publicacao')">Publicações</button>
<button onclick="mostrar('professor')">Professor</button>
<button onclick="mostrar('admin')">Administrador</button>
</nav>

<!-- PUBLICAÇÃO -->
<div id="publicacao" class="section">
<h3>Nova Publicação</h3>
<input id="tituloPub" placeholder="Título"><br><br>
<textarea id="textoPub" placeholder="Texto"></textarea><br><br>
<input type="file" id="arquivoPub"><br><br>
<button onclick="criarPublicacao()">Publicar</button>

<h3>Lista de Publicações</h3>
<div id="listaPublica"></div>
</div>

<!-- PROFESSOR -->
<div id="professor" class="section">
<h3>Abrir Pauta</h3>
<input id="nomeClasse" placeholder="Nome da Classe"><br><br>
<input id="senhaClasse" placeholder="Senha"><br><br>
<button onclick="abrirPauta()">Abrir</button>
<button onclick="guardarPauta()">Guardar Alterações</button>
<div id="areaTabela"></div>
</div>

<!-- ADMIN -->
<div id="admin" class="section">
<h3>Carregar Pauta</h3>
<input id="classeAdmin" placeholder="Nome da Classe"><br><br>
<input id="senhaAdmin" placeholder="Senha da Classe"><br><br>
<input type="file" id="ficheiroExcel"><br><br>
<button onclick="carregarPauta()">Carregar</button>
</div>

<script>

// 🔹 CONFIG FIREBASE (MANTENHA A SUA CONFIGURAÇÃO AQUI)
const firebaseConfig = {
  apiKey: "SUA_APIKEY",
  authDomain: "SEU_DOMINIO",
  projectId: "SEU_PROJECTID",
  storageBucket: "SEU_BUCKET",
  messagingSenderId: "SEU_SENDER",
  appId: "SEU_APPID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

function mostrar(sec){
document.querySelectorAll('.section').forEach(s=>s.style.display='none');
document.getElementById(sec).style.display='block';
}
mostrar('publicacao');

// ================= PUBLICAÇÕES =================
async function criarPublicacao(){
let titulo = tituloPub.value;
let texto = textoPub.value;

if(!titulo && !texto){
alert("Escreva algo para publicar");
return;
}

let dados = {titulo,texto,data:new Date()};
let arquivo = arquivoPub.files[0];

if(arquivo){
let ref = storage.ref('publicacoes/'+arquivo.name);
await ref.put(arquivo);
dados.url = await ref.getDownloadURL();
}

await db.collection("publicacoes").add(dados);
alert("Publicado com sucesso!");
tituloPub.value='';
textoPub.value='';
arquivoPub.value='';
carregarPublica();
}

async function carregarPublica(){
listaPublica.innerHTML='';
let snap = await db.collection("publicacoes").get();
snap.forEach(doc=>{
let d=doc.data();
listaPublica.innerHTML+=`
<div class="card">
<h4>${d.titulo||''}</h4>
<p>${d.texto||''}</p>
${d.url?`<a href="${d.url}" target="_blank">Abrir ficheiro</a>`:''}
</div>`;
});
}
carregarPublica();

// ================= ADMIN CARREGAR PAUTA =================
async function carregarPauta(){
let classe = classeAdmin.value.trim();
let senha = senhaAdmin.value.trim();
let file = ficheiroExcel.files[0];

if(!classe || !senha || !file){
alert("Preencha todos os campos");
return;
}

let reader = new FileReader();
reader.onload = async function(e){
let data = new Uint8Array(e.target.result);
let workbook = XLSX.read(data,{type:'array'});
let sheet = workbook.Sheets[workbook.SheetNames[0]];
let tabela = XLSX.utils.sheet_to_json(sheet,{header:1});

await db.collection("pautas").doc(classe).set({
senha:senha,
dados:tabela
});

alert("Pauta carregada com sucesso!");
};

reader.readAsArrayBuffer(file);
}

// ================= PROFESSOR =================
let dadosTabela=[];

async function abrirPauta(){
let classe = nomeClasse.value.trim();
let senha = senhaClasse.value.trim();

if(!classe || !senha){
alert("Preencha os campos");
return;
}

let doc = await db.collection("pautas").doc(classe).get();

if(!doc.exists){
alert("Pauta não encontrada");
return;
}

if(doc.data().senha!==senha){
alert("Senha incorreta");
return;
}

dadosTabela = doc.data().dados;
renderTabela();
}

function renderTabela(){
let html="<table>";
dadosTabela.forEach((linha,i)=>{
html+="<tr>";
linha.forEach((cel,j)=>{
if(i==0){
html+=`<th>${cel||''}</th>`;
}else{
html+=`<td contenteditable oninput="editar(${i},${j},this.innerText)">${cel||''}</td>`;
}
});
html+="</tr>";
});
html+="</table>";
areaTabela.innerHTML=html;
}

function editar(i,j,val){
dadosTabela[i][j]=val;
}

async function guardarPauta(){
let classe = nomeClasse.value.trim();
let senha = senhaClasse.value.trim();

await db.collection("pautas").doc(classe).set({
senha:senha,
dados:dadosTabela
});

alert("Alterações guardadas!");
}

</script>
</body>
  </html>
