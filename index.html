<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Escola Digital</title>

<link rel="stylesheet" href="style.css">
<script type="module" src="script.js" defer></script>
</head>

<body>

<!-- ================= PORTAL ================= -->
<section id="portal">

<div class="container">

<h1>🏫 Escola Digital</h1>

<div class="card">

<h2>Criar Escola</h2>

<input id="nomeEscola" placeholder="Nome da Escola">
<input id="provincia" placeholder="Província">
<input id="municipio" placeholder="Município">
<input id="anoLetivo" placeholder="Ano Letivo">

<input id="email" placeholder="Email/Telefone">
<input id="senhaEscola" type="password" placeholder="Senha">

<button id="btnCriarEscola">Criar Escola</button>

</div>

<div class="card">
<h2>Escolas Registadas</h2>
<div id="listaEscolas"></div>
</div>

<button onclick="abrirSuperAdmin()">🔐 Super Admin</button>

</div>

</section>

<!-- ================= LOGIN ================= -->
<section id="loginEscola" class="hidden">

<div class="container">

<h2>Entrar na Escola</h2>

<input id="idEscola" placeholder="ID da Escola">
<input id="senhaLogin" type="password" placeholder="Senha">

<button id="btnLoginEscola">Entrar</button>

</div>

</section>

<!-- ================= SUPER ADMIN ================= -->
<section id="superAdmin" class="hidden">

<div class="container">

<h2>SUPER ADMIN</h2>

<input id="senhaSuperAdmin" type="password" placeholder="Senha">

<button onclick="validarSuperAdmin()">Entrar</button>

</div>

</section>

<!-- ================= DASHBOARD ================= -->
<section id="dashboard" class="hidden">

<div class="app">

<aside class="sidebar">

<h3 id="nomeEscolaAtiva"></h3>
<p id="nivelEscolaAtiva"></p>

<button onclick="showPage('home')">Home</button>
<button onclick="showPage('alunos')">Alunos</button>
<button onclick="showPage('professores')">Professores</button>
<button onclick="showPage('turmas')">Turmas</button>
<button onclick="showPage('pautas')">Pautas</button>

<button onclick="sair()">Sair</button>

</aside>

<main class="content">

<section id="home" class="page active">
<div class="card">Sistema ativo</div>
</section>

<section id="alunos" class="page">
<div class="card">Alunos módulo</div>
</section>

<section id="professores" class="page">
<div class="card">Professores módulo</div>
</section>

<section id="turmas" class="page">
<div class="card">Turmas módulo</div>
</section>

<section id="pautas" class="page">

<div class="card">

<h3>Criar Pauta</h3>

<input id="classePauta" placeholder="Classe">
<input id="turmaPauta" placeholder="Turma">
<input id="disciplinaPauta" placeholder="Disciplina">

<button onclick="criarPauta()">Criar Pauta</button>

<div id="listaPautas"></div>

</div>

</section>

</main>

</div>

</section>

</body>
</html>
