<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sistema Escolar</title>

<style>
body{
    font-family: Arial;
    margin:0;
    background:#f2f2f2;
}
header{
    background:#004080;
    color:white;
    padding:15px;
    text-align:center;
}
nav{
    background:#003060;
    padding:10px;
    text-align:center;
}
nav button{
    padding:10px;
    margin:5px;
    border:none;
    background:white;
    cursor:pointer;
    border-radius:5px;
}
section{
    display:none;
    padding:20px;
}
.active{
    display:block;
}
.card{
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
}
input, select, textarea{
    width:100%;
    padding:8px;
    margin:5px 0;
}
button{
    padding:10px;
    margin-top:5px;
    cursor:pointer;
}
#logo{
    max-width:150px;
    display:block;
    margin:auto;
}
</style>
</head>

<body>

<header>
<h2>Sistema Escolar</h2>
<img id="logo">
</header>

<nav>
<button onclick="mostrar('inicio')">Início</button>
<button onclick="mostrar('adminLogin')">Administrador</button>
</nav>

<!-- INICIO -->
<section id="inicio" class="active">
<h3>Publicações</h3>
<div id="publicacoesInicio"></div>
</section>

<!-- LOGIN ADMIN -->
<section id="adminLogin">
<h3>Login Administrador</h3>
<input type="password" id="adminSenha" placeholder="Digite a senha">
<button onclick="entrarAdmin()">Entrar</button>
</section>

<!-- PAINEL ADMIN -->
<section id="adminPainel">
<h3>Painel Administrador</h3>

<button onclick="mostrar('inicio')">Voltar</button>

<h4>Carregar Logotipo</h4>
<input type="file" id="logoUpload">

<h4>Registar Pauta</h4>
<select id="nivelSelect">
<option value="Iniciação">Iniciação</option>
<option value="Primário">Primário</option>
<option value="Iº Ciclo">Iº Ciclo</option>
<option value="IIº Ciclo">IIº Ciclo</option>
</select>
<input type="text" id="classeNome" placeholder="Nome da Classe">
<input type="text" id="senhaClasse" placeholder="Senha da Classe">
<input type="file" id="excelUpload">
<button onclick="registarPauta()">Registar</button>

<h4>Nova Publicação</h4>
<input type="text" id="tituloPub" placeholder="Título">
<textarea id="textoPub" placeholder="Texto"></textarea>
<button onclick="publicar()">Publicar</button>

<h4>Publicações Antigas</h4>
<div id="listaPublicacoesAdmin"></div>

</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-storage.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0NRCbPalAC3Yrfpc8qYdJVU6DxuEOyTw",
  authDomain: "sac-escolar.firebaseapp.com",
  projectId: "sac-escolar",
  storageBucket: "sac-escolar.firebasestorage.app",
  messagingSenderId: "507793955855",
  appId: "1:507793955855:web:405579f5e01b3f90cc577a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let adminPassword = "Admin123";

// NAVEGAÇÃO
window.mostrar = function(id){
    document.querySelectorAll("section").forEach(sec=>{
        sec.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
}

// LOGIN
window.entrarAdmin = function(){
    const senha = document.getElementById("adminSenha").value;
    if(senha === adminPassword){
        mostrar("adminPainel");
        carregarPublicacoesAdmin();
    }else{
        alert("Senha incorreta");
    }
}

// LOGO
document.getElementById("logoUpload").addEventListener("change", async function(e){
    const file = e.target.files[0];
    const storageRef = ref(storage,"logo/logo.png");
    await uploadBytes(storageRef,file);
    const url = await getDownloadURL(storageRef);
    await setDoc(doc(db,"config","logo"),{url});
    carregarLogo();
    alert("Logotipo atualizado");
});

async function carregarLogo(){
    const snap = await getDoc(doc(db,"config","logo"));
    if(snap.exists()){
        document.getElementById("logo").src = snap.data().url;
    }
}
carregarLogo();

// REGISTAR PAUTA
window.registarPauta = async function(){
    const nivel = document.getElementById("nivelSelect").value;
    const classe = document.getElementById("classeNome").value;
    const senha = document.getElementById("senhaClasse").value;
    const file = document.getElementById("excelUpload").files[0];

    if(!classe || !senha || !file){
        alert("Preencha todos os campos");
        return;
    }

    const storageRef = ref(storage,"pautas/"+classe+".xlsx");
    await uploadBytes(storageRef,file);
    const url = await getDownloadURL(storageRef);

    await setDoc(doc(db,"pautas",classe),{
        nivel, senha, url
    });

    alert("Pauta registada com sucesso");
}

// PUBLICAR
window.publicar = async function(){
    const titulo = document.getElementById("tituloPub").value;
    const texto = document.getElementById("textoPub").value;

    await addDoc(collection(db,"publicacoes"),{
        titulo,
        texto,
        data:new Date()
    });

    carregarPublicacoesInicio();
    carregarPublicacoesAdmin();
    alert("Publicado com sucesso");
}

// CARREGAR PUBLICAÇÕES
async function carregarPublicacoesInicio(){
    const container = document.getElementById("publicacoesInicio");
    container.innerHTML="";
    const snap = await getDocs(collection(db,"publicacoes"));
    snap.forEach(docu=>{
        const data = docu.data();
        const div = document.createElement("div");
        div.className="card";
        div.innerHTML=`<h4>${data.titulo}</h4><p>${data.texto}</p>`;
        container.appendChild(div);
    });
}
carregarPublicacoesInicio();

async function carregarPublicacoesAdmin(){
    const container = document.getElementById("listaPublicacoesAdmin");
    container.innerHTML="";
    const snap = await getDocs(collection(db,"publicacoes"));
    snap.forEach(docu=>{
        const data = docu.data();
        const div = document.createElement("div");
        div.className="card";
        div.innerHTML=`
        <strong>${data.titulo}</strong>
        <button onclick="removerPublicacao('${docu.id}')">Remover</button>
        `;
        container.appendChild(div);
    });
}

window.removerPublicacao = async function(id){
    await deleteDoc(doc(db,"publicacoes",id));
    carregarPublicacoesInicio();
    carregarPublicacoesAdmin();
}

</script>

</body>
  </html>
