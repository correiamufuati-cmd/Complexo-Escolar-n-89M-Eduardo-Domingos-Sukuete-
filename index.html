<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>SAC - Sistema de Acesso a Documentos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; }
header { background:#1e3a8a; color:#fff; padding:15px; text-align:center; }
.container { padding:15px; max-width:900px; margin:auto; }
.card { background:#fff; padding:15px; margin-bottom:15px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.1); }
button { padding:10px 15px; border:none; border-radius:6px; cursor:pointer; }
.btn { background:#1e3a8a; color:#fff; }
.btn-red { background:#b91c1c; color:#fff; }
input, select { width:100%; padding:8px; margin:6px 0; }
.hidden { display:none; }
.doc { border-bottom:1px solid #ddd; padding:8px 0; }
small { color:#555; }
h4 { margin-top:15px; }
</style>
</head>
<body>

<header>
<h2>SAC – Sistema de Acesso a Documentos</h2>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginCard">
<h3>Entrar</h3>
<button class="btn" onclick="showAdmin()">Administrador</button><br><br>
<button class="btn" onclick="showProfessor()">Professor</button>
</div>

<!-- LOGIN ADMIN -->
<div class="card hidden" id="adminLogin">
<h3>Login Administrador</h3>
<input type="password" id="adminPass" placeholder="Senha do administrador">
<button class="btn" onclick="loginAdmin()">Entrar</button>
</div>

<!-- PAINEL ADMIN -->
<div class="card hidden" id="adminPanel">
<h3>Painel do Administrador</h3>

<p><strong>Estado do sistema:</strong> <span id="systemStatus"></span></p>
<button class="btn" onclick="toggleSystem()">Ligar / Desligar Sistema</button>

<hr>

<h4>Anexar Documento</h4>
<select id="nivel">
  <option value="">Selecione o nível</option>
  <option value="Ensino Primário">Ensino Primário</option>
  <option value="1º Ciclo">1º Ciclo</option>
</select>
<input type="text" id="docName" placeholder="Nome do documento">
<input type="text" id="docInfo" placeholder="Disciplina / Turma / Trimestre">
<input type="password" id="docPass" placeholder="Senha do documento">
<input type="file" id="docFile" accept=".xls,.xlsx,.doc,.docx">
<button class="btn" onclick="addDocument()">Adicionar</button>

<hr>

<h4>Documentos – Ensino Primário</h4>
<div id="primarioList"></div>

<h4>Documentos – 1º Ciclo</h4>
<div id="cicloList"></div>

<button class="btn-red" onclick="logout()">Sair</button>
</div>

<!-- PAINEL PROFESSOR -->
<div class="card hidden" id="professorPanel">
<h3>Acesso do Professor</h3>
<p id="blockedMsg" class="hidden" style="color:red;">Sistema desligado.</p>

<div id="profAccess">
<input type="password" id="profPass" placeholder="Senha do documento">
<button class="btn" onclick="accessDoc()">Acessar</button>
</div>

<div id="profDoc" class="hidden"></div>

<button class="btn-red" onclick="logout()">Sair</button>
</div>

</div>

<script>
const ADMIN_PASSWORD = "admin123";

function getSystemState(){ return localStorage.getItem("system") !== "off"; }
function setSystemState(on){ localStorage.setItem("system", on ? "on" : "off"); }

function showAdmin(){ loginCard.classList.add("hidden"); adminLogin.classList.remove("hidden"); }
function showProfessor(){ loginCard.classList.add("hidden"); professorPanel.classList.remove("hidden"); checkSystem(); }

function loginAdmin(){
  if(adminPass.value === ADMIN_PASSWORD){
    adminLogin.classList.add("hidden");
    adminPanel.classList.remove("hidden");
    updateStatus(); loadDocs();
  } else alert("Senha incorreta");
}

function logout(){ location.reload(); }

function toggleSystem(){ setSystemState(!getSystemState()); updateStatus(); }
function updateStatus(){ systemStatus.innerText = getSystemState() ? "LIGADO" : "DESLIGADO"; }

function addDocument(){
  const nivel = document.getElementById("nivel").value;
  const file = docFile.files[0];
  if(!nivel || !file) return alert("Preencha todos os campos");

  const reader = new FileReader();
  reader.onload = () => {
    const docs = JSON.parse(localStorage.getItem("docs") || "[]");
    docs.push({
      nivel,
      name: docName.value,
      info: docInfo.value,
      pass: docPass.value,
      fileName: file.name,
      data: reader.result
    });
    localStorage.setItem("docs", JSON.stringify(docs));
    docName.value = docInfo.value = docPass.value = "";
    docFile.value = "";
    document.getElementById("nivel").value = "";
    loadDocs();
  };
  reader.readAsDataURL(file);
}

function loadDocs(){
  primarioList.innerHTML = "";
  cicloList.innerHTML = "";
  const docs = JSON.parse(localStorage.getItem("docs") || "[]");
  docs.forEach(d=>{
    const div = document.createElement("div");
    div.className = "doc";
    div.innerHTML = `<strong>${d.name}</strong><br><small>${d.info}</small>`;
    (d.nivel === "Ensino Primário" ? primarioList : cicloList).appendChild(div);
  });
}

function checkSystem(){
  if(!getSystemState()){
    blockedMsg.classList.remove("hidden");
    profAccess.classList.add("hidden");
  }
}

function accessDoc(){
  const pass = profPass.value;
  const docs = JSON.parse(localStorage.getItem("docs") || "[]");
  const doc = docs.find(d=>d.pass === pass);
  if(!doc) return alert("Senha inválida");

  profDoc.innerHTML = `<h4>${doc.name}</h4><p>${doc.info}</p>
  <a href="${doc.data}" download="${doc.fileName}">📥 Baixar documento</a>`;
  profDoc.classList.remove("hidden");
}
</script>

</body>
  </html>
