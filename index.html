<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Complexo Escolar Nº 89M</title>
<link rel="stylesheet" href="style.css">

<!-- gráfico -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

<!-- MENU -->
<aside class="sidebar">
<h2>📘 Escola 89M</h2>

<button onclick="mostrar('home')">🏠 Início</button>
<button onclick="mostrar('adminLogin')">👨‍💼 Admin</button>
<button onclick="mostrar('lancamento')">🧑‍🏫 Lançamento</button>
<button onclick="mostrar('dashboard')">📊 Dashboard</button>
</aside>

<!-- CONTEÚDO -->
<main class="content">

<header class="topbar">
<h1>Complexo Escolar Nº 89M "Eduardo Domingos Sukuete"</h1>
</header>

<!-- INÍCIO -->
<section id="home" class="pagina ativa">
<h2>Publicações</h2>
<div id="feed" class="grid"></div>

<h2>Ficheiros & Boletins</h2>
<div id="ficheirosHome" class="grid"></div>
</section>

<!-- LOGIN -->
<section id="adminLogin" class="pagina">
<h2>Login Admin</h2>
<input type="password" id="adminSenha">
<button onclick="entrarAdmin()">Entrar</button>
</section>

<!-- ADMIN -->
<section id="admin" class="pagina">

<button onclick="toggleSistema()">Ligar/Desligar Sistema</button>

<h3>Publicações</h3>
<input id="pubTitulo">
<input id="pubTexto">
<button onclick="criarPublicacao()">Publicar</button>
<div id="listaPublicacoes"></div>

<h3>Acessos (Excel)</h3>
<input id="disciplina" placeholder="Disciplina">
<input id="senhaAcesso">
<button onclick="gerarSenha()">Gerar</button>
<input id="linkExcel" placeholder="Link Excel">
<button onclick="criarAcesso()">Guardar</button>

<div id="listaAcessos"></div>

<h3>Ficheiros PDF</h3>
<input type="file" id="ficheiroUpload">
<input id="ficheiroSenha">
<button onclick="gerarSenhaFicheiro()">Gerar</button>
<button onclick="uploadFicheiro()">Carregar</button>

<div id="listaFicheiros"></div>

<h3>Boletins PDF</h3>
<input id="boletimDisciplina">
<input id="boletimLink">
<button onclick="publicarBoletim()">Publicar</button>

<div id="listaBoletins"></div>

</section>

<!-- PROFESSOR -->
<section id="lancamento" class="pagina">
<h2>Área Professor</h2>
<input id="loginDisciplina">
<input id="loginSenha">
<button onclick="entrarProfessor()">Entrar</button>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="pagina">
<h2>Dashboard</h2>
<canvas id="grafico"></canvas>
</section>

</main>
</div>

<div id="pdfViewer"></div>

<script type="module" src="script.js"></script>

</body>
</html>
