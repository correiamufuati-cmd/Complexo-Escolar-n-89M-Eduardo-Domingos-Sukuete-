<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complexo Escolar Nº 89M</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Complexo Escolar Nº 89M "Eduardo Domingos Sukuete"</h1>
</header>

<nav>
  <button onclick="mostrar('inicio')">Início</button>
  <button onclick="mostrar('adminLogin')">Administrador</button>
  <button onclick="mostrar('lancamento')">Lançamento</button>
  <button onclick="mostrar('dashboard')">Dashboard</button>
</nav>

<!-- INÍCIO -->
<section id="inicio" class="pagina ativa">
  <h2>📢 Publicações</h2>
  <div id="publicacoes"></div>

  <h2>📁 Ficheiros e Boletins</h2>
  <div id="ficheiros"></div>
</section>

<!-- LOGIN ADMIN -->
<section id="adminLogin" class="pagina">
  <h2>Admin</h2>
  <input type="password" id="senhaAdmin" placeholder="Senha de administrador">
  <button onclick="entrarAdmin()">Entrar</button>
</section>

<!-- ADMIN -->
<section id="admin" class="pagina">

<h2>Painel Admin</h2>

<button onclick="toggleSistema()">Ligar/Desligar Sistema</button>

<hr>

<h3>Publicações</h3>
<input id="tituloPub" placeholder="Título">
<textarea id="textoPub" placeholder="Texto"></textarea>
<button onclick="publicar()">Publicar</button>

<div id="listaPublicacoes"></div>

<hr>

<h3>Upload de Ficheiro / PDF</h3>

<input id="nomeFicheiro" placeholder="Nome (Ex: Matemática)">
<input type="file" id="pdfUpload">
<input type="password" id="senhaPDF" placeholder="Senha do ficheiro">

<button onclick="uploadPDF()">Carregar</button>

<div id="listaPDFs"></div>

</section>

<!-- LANCAMENTO -->
<section id="lancamento" class="pagina">

<h2>📚 Lançamento de Notas</h2>

<label>Disciplina</label>
<input id="disciplinaLogin" placeholder="Ex: Matemática">

<label>Senha</label>
<input type="password" id="senhaLogin">

<button onclick="entrarProfessor()">Entrar</button>

</section>

<!-- DASHBOARD -->
<section id="dashboard" class="pagina">

<h2>📊 Dashboard</h2>

<div class="card">
Publicações: <span id="totalPub">0</span>
</div>

<div class="card">
Ficheiros: <span id="totalFiles">0</span>
</div>

</section>

<!-- PDF VIEWER -->
<div id="viewer"></div>

<script src="script.js"></script>
</body>
</html>
