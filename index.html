<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Complexo Escolar Nº 89M</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->
<aside class="sidebar">
<h2>📘 89M</h2>

<button onclick="mostrar('home')">🏠 Início</button>
<button onclick="mostrar('adminLogin')">👨‍💼 Admin</button>
<button onclick="mostrar('lancamento')">🧑‍🏫 Lançamento</button>
<button onclick="mostrar('dashboard')">📊 Dashboard</button>
<button onclick="mostrar('estatistica')">📈 Estatística</button>

</aside>

<!-- MAIN -->
<main class="content">

<header class="topbar">
<h1>Complexo Escolar Nº 89M "Eduardo Domingos Sukuete"</h1>
<div id="fraseMotivacional"></div>
</header>

<!-- INÍCIO -->
<section id="home" class="pagina ativa">

<marquee>📢 Sistema Escolar Digital | Gestão de Notas e Boletins</marquee>

<h2>Publicações</h2>
<div id="feed" class="grid"></div>

<h2>Ficheiros & Boletins</h2>
<div id="ficheirosHome" class="grid"></div>

</section>

<!-- ADMIN LOGIN -->
<section id="adminLogin" class="pagina">
<h2>Acesso Administrador</h2>
<input type="password" id="adminSenha">
<button onclick="entrarAdmin()">Entrar</button>
</section>

<!-- ADMIN -->
<section id="admin" class="pagina">

<h2>Painel Administrador</h2>

<button onclick="toggleSistema()">🔌 Ligar/Desligar Sistema</button>

<h3>Publicações</h3>
<input id="pubTitulo" placeholder="Título">
<input id="pubTexto" placeholder="Texto">
<button onclick="criarPublicacao()">Publicar</button>
<div id="listaPublicacoes"></div>

<h3>Acessos Excel</h3>
<input id="disciplina" placeholder="Disciplina">
<input id="senhaAcesso" placeholder="Senha">
<button onclick="gerarSenha()">Gerar Senha</button>
<input id="linkExcel" placeholder="Link Excel">
<button onclick="criarAcesso()">Guardar</button>
<div id="listaAcessos"></div>

<h3>Upload PDF</h3>
<input type="file" id="ficheiroUpload">
<input id="ficheiroSenha" placeholder="Senha">
<button onclick="gerarSenhaFicheiro()">Gerar Senha</button>
<button onclick="uploadFicheiro()">Enviar</button>

<div id="listaFicheiros"></div>

<h3>Boletins PDF</h3>
<input id="boletimDisciplina" placeholder="Disciplina">
<input id="boletimLink" placeholder="Link PDF">
<button onclick="publicarBoletim()">Publicar</button>

<div id="listaBoletins"></div>

</section>

<!-- PROFESSOR -->
<section id="lancamento" class="pagina">
<h2>Área Professor</h2>
<input id="loginDisciplina">
<input id="loginSenha">
<button onclick="entrarProfessor()">Entrar</button>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="pagina">
<h2>Dashboard</h2>
<canvas id="grafico"></canvas>
</section>

<!-- ESTATÍSTICA -->
<section id="estatistica" class="pagina">
<h2>Estatística (Excel)</h2>
<input type="file" id="excelFile" onchange="analisarExcel(this.files[0])">
<div id="estatisticas"></div>
</section>

</main>
</div>

<!-- PDF VIEWER -->
<div id="pdfViewer"></div>

<script type="module" src="script.js"></script>

</body>
  </html>
