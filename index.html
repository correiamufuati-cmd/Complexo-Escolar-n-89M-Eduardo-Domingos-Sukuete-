<!DOCTYPE html><html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAC - Complexo Escolar N° 89M "Eduardo Domingos Sukuete"</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background-color: #BFEFFF; }
button { padding: 10px 15px; margin: 5px; }
.hidden { display: none; }
input[type=file], input[type=text], input[type=password], input[type=number], select { margin: 5px 0; padding: 5px; }
#teacher-section { background-color: #E0FFFF; padding: 15px; margin-top: 20px; border-radius: 8px; }
.stat { margin-top: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
#header { display: flex; align-items: center; margin-bottom: 20px; }
#logo { max-height: 80px; margin-right: 15px; }
#school-name { font-size: 1.5em; font-weight: bold; }
#admin-section { background-color: #E6F7FF; padding: 15px; border-radius: 8px; }
#uploaded-docs, #teacher-docs { list-style-type: none; padding-left: 0; }
</style>
</head>
<body>
<div id="header">
<img id="logo" src="" alt="Logotipo da Escola" class="hidden">
<div id="school-name">Complexo Escolar N° 89M "Eduardo Domingos Sukuete"</div>
</div><div id="login-section">
<h2>Login</h2>
<input type="text" id="login-username" placeholder="Usuário">
<br>
<input type="password" id="login-password" placeholder="Senha">
<br>
<button id="login-btn">Entrar</button>
<p id="login-msg"></p>
</div><div id="admin-section" class="hidden">
<h2>Administrador</h2>
<p>Status do sistema: <span id="system-status">Fechado</span></p>
<button id="toggle-system">Ligar Sistema</button>
<br>
<label>Upload de documento:</label>
<input type="file" id="file-upload" multiple>
<ul id="uploaded-docs"></ul>
<h3>Gerar contas de professores</h3>
<label>Usuário do professor:</label>
<input type="text" id="new-user" placeholder="Nome do professor">
<br>
<button id="generate-password">Gerar senha</button>
<p id="generated-password"></p>
<div id="stats-section" class="stat hidden">
<h3>Estatísticas por Disciplina</h3>
<div id="stats-output"></div>
</div>
<div id="logo-upload-section">
<h3>Upload do Logotipo da Escola</h3>
<input type="file" id="logo-upload" accept="image/*">
</div>
</div><div id="teacher-section" class="hidden">
<h2>Professor</h2>
<p>O sistema está <span id="teacher-status">fechado</span>. Lançamentos não disponíveis.</p>
<ul id="teacher-docs"></ul>
<label>Selecione disciplina:</label>
<select id="discipline-select"></select>
<br>
<label>Aluno:</label>
<input type="text" id="student-name" placeholder="Nome do aluno">
<br>
<label>Sexo:</label>
<select id="student-gender">
<option value="M">Masculino</option>
<option value="F">Feminino</option>
</select>
<br>
<label>Nota:</label>
<input type="number" id="student-grade" min="0" max="20">
<br>
<button id="submit-grade">Lançar Nota</button>
</div><script>
// Contas iniciais de teste
const accounts = {
    'admin': 'Admin123'
};

// Contas geradas de professores
const teacherAccounts = {};

// Sistema aberto/fechado
let systemOpen = false;
const toggleBtn = document.getElementById('toggle-system');
const systemStatus = document.getElementById('system-status');
const teacherSection = document.getElementById('teacher-section');
const teacherStatus = document.getElementById('teacher-status');
const uploadedDocsList = document.getElementById('uploaded-docs');
const teacherDocsList = document.getElementById('teacher-docs');
const statsSection = document.getElementById('stats-section');
const statsOutput = document.getElementById('stats-output');
const disciplineSelect = document.getElementById('discipline-select');
const logoUploadSection = document.getElementById('logo-upload-section');
const logoUpload = document.getElementById('logo-upload');
const logoImg = document.getElementById('logo');

// Logo upload
logoUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
        logoImg.src = event.target.result;
        logoImg.className = '';
    }
    reader.readAsDataURL(file);
});

// Login
const loginSection = document.getElementById('login-section');
const loginBtn = document.getElementById('login-btn');
const loginMsg = document.getElementById('login-msg');

loginBtn.addEventListener('click', () => {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim();

    if(accounts[username] && accounts[username] === password) {
        loginSection.className = 'hidden';
        document.getElementById('admin-section').className = '';
        logoUploadSection.className = '';
        return;
    }

    if(teacherAccounts[username] && teacherAccounts[username] === password) {
        loginSection.className = 'hidden';
        teacherSection.className = systemOpen ? '' : 'hidden';
        return;
    }

    loginMsg.textContent = 'Usuário ou senha incorretos';
});

// Toggle sistema
toggleBtn.addEventListener('click', () => {
    systemOpen = !systemOpen;
    systemStatus.textContent = systemOpen ? 'Aberto' : 'Fechado';
    toggleBtn.textContent = systemOpen ? 'Fechar Sistema' : 'Ligar Sistema';
    teacherStatus.textContent = systemOpen ? 'aberto' : 'fechado';
    teacherSection.className = systemOpen ? '' : 'hidden';
});

// Upload de documentos
const fileUpload = document.getElementById('file-upload');
fileUpload.addEventListener('change', (e) => {
    for (const file of e.target.files) {
        const li = document.createElement('li');
        li.textContent = file.name;
        uploadedDocsList.appendChild(li);
        const teacherLi = document.createElement('li');
        teacherLi.textContent = file.name;
        teacherDocsList.appendChild(teacherLi);
        const option = document.createElement('option');
        option.value = file.name;
        option.textContent = file.name;
        disciplineSelect.appendChild(option);
    }
});

// Gerar senha de professor
const generateBtn = document.getElementById('generate-password');
const newUserInput = document.getElementById('new-user');
const generatedPasswordP = document.getElementById('generated-password');

generateBtn.addEventListener('click', () => {
    const username = newUserInput.value.trim();
    if(!username) return alert('Digite o nome do professor');
    const password = Math.random().toString(36).slice(-8);
    teacherAccounts[username] = password;
    generatedPasswordP.textContent = `Usuário: ${username} | Senha: ${password}`;
});

// Lançamento de notas (básico)
const submitGradeBtn = document.getElementById('submit-grade');
submitGradeBtn.addEventListener('click', () => {
    if(!systemOpen) return alert('O sistema está fechado!');
    const disciplina = disciplineSelect.value;
    const name = document.getElementById('student-name').value.trim();
    const gender = document.getElementById('student-gender').value;
    const grade = parseFloat(document.getElementById('student-grade').value);
    if(!disciplina || !name || isNaN(grade)) return alert('Preencha todos os campos!');

    const li = document.createElement('li');
    li.textContent = `${name} (${gender}) - ${disciplina}: ${grade}`;
    teacherDocsList.appendChild(li);
    alert('Nota lançada!');
});
</script></body>
    </html>
