<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Escola Digital</title>

<link rel="stylesheet" href="./style.css">
<script type="module" src="script.js" defer></script>
</head>

<body>

<!-- ================= PORTAL ================= -->
<section id="portal">

<div class="container">

<h1>🏫 Escola Digital</h1>

<div class="card">

<h2>Criar Escola</h2>

<input id="nomeEscola" placeholder="Nome da Escola">
<input id="provincia" placeholder="Província">
<input id="municipio" placeholder="Município">
<input id="anoLetivo" placeholder="Ano Letivo">

<input id="email" placeholder="Email/Telefone">
<input id="senhaEscola" type="password" placeholder="Senha">

<button id="btnCriarEscola">Criar Escola</button>

</div>

<div class="card">
<h2>Escolas Registadas</h2>
<div id="listaEscolas"></div>
</div>

<button id="btnSuperAdmin">Super Admin</button>

</div>

</section>

<!-- ================= LOGIN ESCOLA ================= -->
<section id="loginEscola" class="hidden">
<div class="container">

<h2>Login Escola</h2>

<input id="idEscola" placeholder="ID">
<input id="senhaLogin" type="password" placeholder="Senha">

<button id="btnLoginEscola">Entrar</button>

</div>
</section>

<!-- ================= DASHBOARD ESCOLA ================= -->
<section id="dashboard" class="hidden">

<div class="app">

<aside class="sidebar">

<h3 id="nomeEscolaAtiva"></h3>
<p id="nivelEscolaAtiva"></p>

<button class="pageBtn" data-page="home">Painel</button>
<button class="pageBtn" data-page="alunos">Alunos</button>
<button class="pageBtn" data-page="professores">Professores</button>
<button class="pageBtn" data-page="turmas">Turmas</button>

<button onclick="sair()">Sair</button>

</aside>

<main class="content">

<section id="home" class="page"><h2>Painel Principal</h2></section>
<section id="alunos" class="page"><h2>Gestão de Alunos</h2></section>
<section id="professores" class="page"><h2>Gestão de Professores</h2></section>
<section id="turmas" class="page"><h2>Gestão de Turmas</h2></section>

</main>

</div>

</section>

<!-- ================= SUPER ADMIN LOGIN ================= -->
<section id="superAdmin" class="hidden">

<div class="container">

<h2>SUPER ADMIN</h2>

<input id="senhaSuperAdmin" type="password" placeholder="Senha">

<button id="btnValidarSuperAdmin">Entrar</button>

</div>

</section>

<!-- ================= SUPER ADMIN DASHBOARD ================= -->
<section id="superAdminDashboard" class="hidden">

<div class="app">

<aside class="sidebar">

<h3>SUPER ADMIN</h3>

<button class="adminBtn" data-admin="escolas">Escolas</button>
<button class="adminBtn" data-admin="stats">Estatísticas</button>
<button class="adminBtn" data-admin="config">Configurações</button>

<button onclick="logout()">Sair</button>

</aside>

<main class="content">

<section id="escolas" class="adminPage"><h2>Escolas Registadas</h2></section>
<section id="stats" class="adminPage"><h2>Estatísticas Gerais</h2></section>
<section id="config" class="adminPage"><h2>Configurações</h2></section>

</main>

</div>

</section>

</body>
</html>
