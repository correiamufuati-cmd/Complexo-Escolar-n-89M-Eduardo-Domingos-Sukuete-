<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Complexo Escolar Nº 89M</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>Complexo Escolar Nº 89M "Eduardo Domingos Sukuete"</h1>
</header>

<nav class="menu">
<button onclick="mostrar('dashboard')">Dashboard</button>
<button onclick="mostrar('acessos')">Acessos</button>
<button onclick="mostrar('publicacoes')">Publicações</button>
<button onclick="mostrar('config')">Configuração</button>
</nav>

<!-- DASHBOARD -->
<section id="dashboard" class="pagina ativa">
<h2>Painel Geral</h2>

<div class="dashboard">
<div class="card">👨‍🏫 Professores: <span id="totalAcessos">0</span></div>
<div class="card">📄 Publicações: <span id="totalPublicacoes">0</span></div>
<div class="card">⚙️ Sistema: <span id="estadoSistema">---</span></div>
</div>
</section>

<!-- ACESSOS -->
<section id="acessos" class="pagina">

<h2>Gestão de Professores</h2>

<input id="professor" placeholder="Nome do Professor">
<input id="disciplina" placeholder="Disciplina">

<input id="senhaAcesso" placeholder="Senha">
<button onclick="gerarSenha()">Gerar Senha</button>

<input id="linkExcel" placeholder="Link Excel">

<button onclick="criarAcesso()">Guardar</button>

<h3>Lista de Acessos</h3>
<div id="listaAcessos"></div>

</section>

<!-- PUBLICAÇÕES -->
<section id="publicacoes" class="pagina">

<h2>Publicações</h2>

<input id="pubTitulo" placeholder="Título">
<input id="pubTexto" placeholder="Texto">

<button onclick="criarPublicacao()">Publicar</button>

<div id="listaPublicacoes"></div>

</section>

<!-- CONFIG -->
<section id="config" class="pagina">

<h2>Configuração</h2>

<button onclick="toggleSistema()">Ligar / Desligar Sistema</button>

<h3>Acesso Professor</h3>
<input id="loginDisciplina" placeholder="Disciplina">
<input id="loginSenha" placeholder="Senha">
<button onclick="entrarProfessor()">Entrar</button>

</section>

<script type="module" src="./script.js"></script>

</body>
  </html>
