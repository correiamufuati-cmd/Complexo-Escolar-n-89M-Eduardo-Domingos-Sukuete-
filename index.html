<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Complexo Escolar Nº 89M</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>Complexo Escolar Nº 89M "Eduardo Domingos Sukuete"</h1>
</header>

<nav>
<button onclick="mostrar('home')">Início</button>
<button onclick="mostrar('admin')">Administrador</button>
<button onclick="mostrar('lancamento')">Lançamento</button>
</nav>

<!-- INÍCIO -->
<section id="home" class="pagina ativa">

<div class="banner">
  <marquee>📢 Bem-vindo ao sistema escolar digital | Publicidades aqui</marquee>
</div>

<img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1" class="img-topo">

<h2>Publicações</h2>
<div id="feed"></div>

</section>

<!-- ADMIN -->
<section id="admin" class="pagina">

<h2>Painel do Administrador</h2>

<!-- SISTEMA -->
<button onclick="toggleSistema()">Ligar / Desligar Sistema</button>

<!-- PUBLICAÇÕES -->
<h3>Publicações</h3>
<input id="pubTitulo" placeholder="Título">
<input id="pubTexto" placeholder="Texto">
<button onclick="criarPublicacao()">Publicar</button>

<div id="listaPublicacoes"></div>

<!-- ACESSOS -->
<h3>Gerar Acesso</h3>
<input id="disciplina" placeholder="Disciplina">
<input id="senhaAcesso" placeholder="Senha">
<button onclick="gerarSenha()">Gerar Senha</button>
<input id="linkExcel" placeholder="Link Excel">

<button onclick="criarAcesso()">Guardar Acesso</button>

<div id="listaAcessos"></div>

<!-- UPLOAD -->
<h3>Partilhar Ficheiro</h3>
<input type="file" id="ficheiro">
<button onclick="alert('Upload simulado (ligar Firebase Storage depois)')">Partilhar</button>

</section>

<!-- LANÇAMENTO -->
<section id="lancamento" class="pagina">

<h2>Área do Professor</h2>

<input id="loginDisciplina" placeholder="Disciplina">
<input id="loginSenha" placeholder="Senha">

<button onclick="entrarProfessor()">Entrar</button>

</section>

<script type="module" src="./script.js"></script>

</body>
  </html>
