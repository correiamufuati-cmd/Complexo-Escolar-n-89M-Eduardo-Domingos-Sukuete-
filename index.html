<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complexo Escolar Nº 89M</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="script.js"></script>
</head>

<body>

<div class="app">

<!-- MENU LATERAL -->
<aside class="sidebar">
<h2>🎓 89M</h2>

<button onclick="mostrar('inicio')">🏠 Início</button>
<button onclick="mostrar('publicacoes')">📢 Publicações</button>
<button onclick="mostrar('pautas')">📚 Pautas</button>
<button onclick="mostrar('aluno')">👨‍🎓 Aluno</button>
<button onclick="mostrar('encarregado')">👨‍👩‍👧 Encarregado</button>
<button onclick="mostrar('admin')">⚙️ Administração</button>
</aside>

<!-- CONTEÚDO -->
<main class="content">

<!-- INÍCIO -->
<section id="inicio" class="page active">
<h2>Bem-vindo</h2>
<p id="estadoSistema">Sistema a carregar...</p>
<div id="inicioPublicacoes"></div>
</section>

<!-- PUBLICAÇÕES -->
<section id="publicacoes" class="page">
<h2>Publicações</h2>

<input id="tituloPub" placeholder="Título">
<textarea id="textoPub" placeholder="Texto"></textarea>
<button onclick="criarPublicacao()">Publicar</button>

<div id="listaPublicacoes"></div>
</section>

<!-- PAUTAS -->
<section id="pautas" class="page">
<h2>Pautas Online</h2>

<select id="pautaSelect"></select>
<input id="senhaPauta" type="password" placeholder="Senha">
<button onclick="entrarPauta()">Entrar</button>
</section>

<!-- ALUNO -->
<section id="aluno" class="page">
<h2>Área do Aluno</h2>

<input id="senhaAluno" type="password" placeholder="Senha">
<button onclick="loginAluno()">Entrar</button>

<div id="boletim"></div>
</section>

<!-- ENCARREGADO -->
<section id="encarregado" class="page">
<h2>Área do Encarregado</h2>

<input id="senhaEnc" type="password" placeholder="Senha">
<button onclick="loginEnc()">Entrar</button>

<div id="filhos"></div>
</section>

<!-- ADMIN -->
<section id="admin" class="page">

<h2>Administração</h2>

<input type="file" id="excelFile">
<button onclick="importarExcel()">Importar Excel</button>

<input type="file" id="pdfFile">
<button onclick="uploadPDF()">Upload PDF</button>

<h3>Publicações</h3>
<div id="listaAdmin"></div>

<h3>Pautas</h3>
<div id="listaPautas"></div>

</section>

</main>
</div>

</body>
    </html>
