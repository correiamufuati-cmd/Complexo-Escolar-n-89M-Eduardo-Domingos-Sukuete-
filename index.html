<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Escola Digital</title>

<link rel="stylesheet" href="style.css">

<!-- Firebase COMPAT (NÃO MODULE) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js";
</script>

<script src="script.js" defer></script>
</head>

<body>

<section id="portal">
<div class="container">

<h1>Escola Digital</h1>

<div class="card">
<h2>Criar Escola</h2>
<input id="nomeEscola" placeholder="Nome">
<input id="provincia" placeholder="Província">
<input id="municipio" placeholder="Município">
<input id="anoLetivo" placeholder="Ano Letivo">
<input id="email" placeholder="Contacto">
<input id="senhaEscola" type="password" placeholder="Senha">
<button onclick="criarEscola()">Criar Escola</button>
</div>

<div class="card">
<h2>Escolas</h2>
<div id="listaEscolas"></div>
</div>

<button onclick="abrirSuperAdmin()">Super Admin</button>

</div>
</section>

<!-- LOGIN -->
<section id="loginEscola" class="hidden">
<div class="container">
<h2>Login Escola</h2>

<input id="idEscola">
<input id="senhaLogin" type="password">

<button onclick="loginEscola()">Entrar</button>
</div>
</section>

<!-- SUPER ADMIN -->
<section id="superAdmin" class="hidden">
<div class="container">

<h2>Super Admin</h2>

<input id="senhaSuperAdmin" type="password">
<button onclick="validarSuperAdmin()">Entrar</button>

</div>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="hidden">

<div class="app">

<aside class="sidebar">

<h3 id="nomeEscolaAtiva"></h3>

<button onclick="showPage('home')">Home</button>
<button onclick="showPage('alunos')">Alunos</button>
<button onclick="showPage('turmas')">Turmas</button>
<button onclick="showPage('pautas')">Mini-Pautas</button>

<button onclick="sair()">Sair</button>

</aside>

<main class="content">

<section id="home" class="page active">
<div class="card">Sistema ativo</div>
</section>

<section id="alunos" class="page">

<div class="card">
<h3>Alunos</h3>
<input id="nomeAluno">
<input id="turmaAluno">
<button onclick="criarAluno()">Criar</button>
</div>

<div class="card">
<div id="listaAlunos"></div>
</div>

</section>

<section id="turmas" class="page">

<div class="card">
<h3>Turmas</h3>
<input id="classeTurma">
<input id="nomeTurma">
<input id="anoTurma">
<button onclick="criarTurma()">Criar</button>
</div>

<div class="card">
<h3>Importar PDF</h3>
<input type="file" id="pdfFile">
<input id="turmaPDF">
<button onclick="importarPDF()">Importar</button>
</div>

</section>

</main>

</div>

</section>

</body>
</html>
