<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAC - Complexo Escolar N° 89M "Eduardo Domingos Sukuete"</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background-color: #BFEFFF; }
button { padding: 10px 15px; margin: 5px; cursor: pointer; }
.hidden { display: none; }
input[type=file], input[type=text], input[type=password], input[type=number], select { margin: 5px 0; padding: 5px; }
#teacher-section { background-color: #E0FFFF; padding: 15px; margin-top: 20px; border-radius: 8px; }
.stat { margin-top: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
#header { display: flex; align-items: center; margin-bottom: 20px; }
#logo { max-height: 80px; margin-right: 15px; }
#school-name { font-size: 1.5em; font-weight: bold; }
#admin-section { background-color: #E6F7FF; padding: 15px; border-radius: 8px; }
#uploaded-docs, #teacher-docs { list-style-type: none; padding-left: 0; }
</style>
<!-- SheetJS para manipulação de Excel -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<div id="header">
<img id="logo" src="" alt="Logotipo da Escola" class="hidden">
<div id="school-name">Complexo Escolar N° 89M "Eduardo Domingos Sukuete"</div>
</div>

<!-- Login -->
<div id="login-section">
<h2>Login</h2>
<input type="text" id="login-username" placeholder="Usuário"><br>
<input type="password" id="login-password" placeholder="Senha"><br>
<button id="login-btn">Entrar</button>
<p id="login-msg"></p>
</div>

<!-- Administração -->
<div id="admin-section" class="hidden">
<h2>Administrador</h2>
<label>Upload de planilha Excel:</label>
<input type="file" id="file-upload" accept=".xlsx,.xls"><br>
<ul id="uploaded-docs"></ul>
<h3>Gerar conta de professor</h3>
<label>Usuário do professor:</label>
<input type="text" id="new-user" placeholder="Nome do professor"><br>
<button id="generate-password">Gerar senha</button>
<p id="generated-password"></p>
<div id="logo-upload-section">
<h3>Upload do Logotipo da Escola</h3>
<input type="file" id="logo-upload" accept="image/*">
</div>
</div>

<!-- Professores -->
<div id="teacher-section" class="hidden">
<h2>Professor</h2>
<p>Selecione a planilha:</p>
<select id="excel-select"></select>
<button id="load-excel">Carregar</button>
<ul id="teacher-docs"></ul>

<div id="grade-section" class="hidden">
<label>Selecione disciplina:</label>
<select id="discipline-select"></select><br>
<label>Aluno:</label>
<input type="text" id="student-name" placeholder="Nome do aluno"><br>
<label>Sexo:</label>
<select id="student-gender">
<option value="M">Masculino</option>
<option value="F">Feminino</option>
</select><br>
<label>Nota:</label>
<input type="number" id="student-grade" min="0" max="20"><br>
<button id="submit-grade">Lançar Nota</button>
<button id="download-excel">Baixar Pauta Atualizada</button>
</div>
</div>

<script>
// Contas iniciais
const adminAccount = { username: 'admin', password: 'Admin123' };
const teacherAccounts = {}; // preenchido pelo admin

let loadedWorkbook = null;
let loadedJson = [];
let systemOpen = true;

// Logo upload
const logoUpload = document.getElementById('logo-upload');
const logoImg = document.getElementById('logo');
logoUpload.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
        logoImg.src = event.target.result;
        logoImg.className = '';
    }
    reader.readAsDataURL(file);
});

// Login
const loginSection = document.getElementById('login-section');
const loginBtn = document.getElementById('login-btn');
const loginMsg = document.getElementById('login-msg');
const adminSection = document.getElementById('admin-section');
const teacherSection = document.getElementById('teacher-section');

loginBtn.addEventListener('click', () => {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim();

    if(username === adminAccount.username && password === adminAccount.password){
        loginSection.className = 'hidden';
        adminSection.className = '';
        return;
    }

    if(teacherAccounts[username] && teacherAccounts[username] === password){
        loginSection.className = 'hidden';
        teacherSection.className = '';
        populateExcelSelect();
        return;
    }

    loginMsg.textContent = 'Usuário ou senha incorretos';
});

// Gerar senha professor
const generateBtn = document.getElementById('generate-password');
const newUserInput = document.getElementById('new-user');
const generatedPasswordP = document.getElementById('generated-password');

generateBtn.addEventListener('click', () => {
    const username = newUserInput.value.trim();
    if(!username) return alert('Digite o nome do professor');
    const password = Math.random().toString(36).slice(-8);
    teacherAccounts[username] = password;
    generatedPasswordP.textContent = `Usuário: ${username} | Senha: ${password}`;
});

// Upload Excel
const fileUpload = document.getElementById('file-upload');
const uploadedDocsList = document.getElementById('uploaded-docs');
const excelSelect = document.getElementById('excel-select');
const disciplineSelect = document.getElementById('discipline-select');
let excelFiles = {};

fileUpload.addEventListener('change', e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(event){
        const data = new Uint8Array(event.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        excelFiles[file.name] = workbook;
        const li = document.createElement('li');
        li.textContent = file.name;
        uploadedDocsList.appendChild(li);
    }
    reader.readAsArrayBuffer(file);
});

function populateExcelSelect(){
    excelSelect.innerHTML = '';
    for(const name in excelFiles){
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        excelSelect.appendChild(option);
    }
}

// Carregar Excel
const gradeSection = document.getElementById('grade-section');
const loadExcelBtn = document.getElementById('load-excel');
loadExcelBtn.addEventListener('click', () => {
    const selected = excelSelect.value;
    if(!selected) return alert('Selecione uma planilha');
    loadedWorkbook = excelFiles[selected];
    const firstSheet = loadedWorkbook.SheetNames[0];
    loadedJson = XLSX.utils.sheet_to_json(loadedWorkbook.Sheets[firstSheet]);
    populateDisciplineSelect();
    gradeSection.className = '';
});

// Popular disciplinas
function populateDisciplineSelect(){
    disciplineSelect.innerHTML = '';
    const disciplines = [...new Set(loadedJson.map(r=>r.Disciplina || ''))];
    disciplines.forEach(d => {
        const option = document.createElement('option');
        option.value = d;
        option.textContent = d;
        disciplineSelect.appendChild(option);
    });
}

// Lançar nota
const submitGradeBtn = document.getElementById('submit-grade');
submitGradeBtn.addEventListener('click', () => {
    const disciplina = disciplineSelect.value;
    const name = document.getElementById('student-name').value.trim();
    const gender = document.getElementById('student-gender').value;
    const grade = parseFloat(document.getElementById('student-grade').value);
    if(!disciplina || !name || isNaN(grade)) return alert('Preencha todos os campos!');

    const student = loadedJson.find(s => s.Nome === name && s.Disciplina === disciplina);
    if(student){
        student.Nota = grade;
    } else {
        loadedJson.push({ Nome:name, Disciplina:disciplina, Sexo:gender, Nota:grade });
    }
    alert('Nota lançada!');
});

// Baixar Excel atualizado
const downloadBtn = document.getElementById('download-excel');
downloadBtn.addEventListener('click', () => {
    if(!loadedWorkbook) return alert('Carregue uma planilha primeiro!');
    const newSheet = XLSX.utils.json_to_sheet(loadedJson);
    const newWB = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(newWB, newSheet, 'Pauta Atualizada');
    XLSX.writeFile(newWB, 'pauta_atualizada.xlsx');
});
</script>
</body>
    </html>
