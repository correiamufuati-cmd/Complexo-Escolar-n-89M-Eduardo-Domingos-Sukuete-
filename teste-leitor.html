<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<title>Teste PDF</title>
</head>

<body>

<h2>VERSÃO NOVA DO TESTE</h2>

<input type="file" id="pdfFile" accept="application/pdf">

<pre id="resultado"></pre>


<script type="module">

import { lerPDF } from "./services/pdf-reader.js";


const input = document.getElementById("pdfFile");
const resultado = document.getElementById("resultado");


resultado.innerHTML = "Leitor carregado!";


input.addEventListener("change", async()=>{


const arquivo = input.files[0];

if(!arquivo) return;


resultado.innerHTML = "A chamar leitor PDF...";


try {

const texto = await lerPDF(arquivo);


resultado.innerHTML =
"Resultado:\n\n" + texto;


}
catch(erro){

resultado.innerHTML =
"Erro:\n" + erro.message;

}


});


</script>

</body>

    </html>
