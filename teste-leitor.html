<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<title>Teste PDF</title>
</head>

<body>

<h2>Teste Leitor PDF</h2>

<input type="file" id="pdfFile" accept="application/pdf">

<pre id="resultado"></pre>


<script type="module">

const input = document.getElementById("pdfFile");
const resultado = document.getElementById("resultado");


resultado.innerHTML = "JavaScript funcionando!";


input.addEventListener("change", ()=>{

    const arquivo = input.files[0];

    if(!arquivo) return;


    resultado.innerHTML =
    "Escolhido:\n" +
    arquivo.name +
    "\n\nTamanho:\n" +
    arquivo.size + " bytes";


});

</script>

</body>

  </html>
