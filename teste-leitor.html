<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<title>Teste PDF</title>
</head>

<body>

<h2>Teste Leitor PDF</h2>

<input type="file" id="pdfFile" accept="application/pdf">

<pre id="resultado"></pre>


<script type="module">

import { lerPDF } from "./services/pdf-reader.js";


const input = document.getElementById("pdfFile");
const resultado = document.getElementById("resultado");


resultado.innerHTML = "Leitor PDF carregado!";


input.addEventListener("change", async()=>{

    const arquivo = input.files[0];

    if(!arquivo) return;


    resultado.innerHTML =
    "PDF escolhido: " + arquivo.name +
    "\n\nA iniciar leitura...";


    try{

        const texto = await lerPDF(arquivo);


        resultado.innerHTML =
        "Leitura concluída:\n\n" +
        (texto || "Nenhum texto encontrado");


    }catch(erro){

        resultado.innerHTML =
        "Erro ao ler PDF:\n" +
        erro.message;

    }


});


</script>

</body>

  </html>
