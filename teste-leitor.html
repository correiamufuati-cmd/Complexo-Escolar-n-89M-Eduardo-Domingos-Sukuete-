<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<title>Teste PDF</title>
</head>

<body>

<h2>VERSÃO NOVA DO TESTE</h2>

<input type="file" id="pdfFile" accept="application/pdf">

<pre id="resultado"></pre>

<script src="./services/pdf-reader.js"></script>
    
<script>

const input = document.getElementById("pdfFile");
const resultado = document.getElementById("resultado");


resultado.innerHTML = "JavaScript normal carregado!";


input.addEventListener("change", function(){


    const arquivo = input.files[0];


    if(!arquivo){

        resultado.innerHTML = "Nenhum ficheiro selecionado";
        return;

    }


    resultado.innerHTML =
    "Ficheiro escolhido:\n\n" +
    arquivo.name;


});


</script>

</body>

    </html>
