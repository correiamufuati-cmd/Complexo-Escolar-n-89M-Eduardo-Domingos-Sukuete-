    function extrairDadosTurma(items){

    let dados = {

        classe: "",
        turma: "",
        ano: ""

    };


    const texto = items
    .map(item => item.str.trim())
    .join(" ");


    const classe = texto.match(/Classe:\s*(\d+)/);

    if(classe){

        dados.classe = classe[1] + "ª";

    }


    const turma = texto.match(/Turma:\s*([A-Z])/);

    if(turma){

        dados.turma = turma[1];

    }


    const ano = texto.match(/202\s?\d\s*\/\s*202\s?\d/);

    if(ano){

        dados.ano = ano[0];

    }


    return dados;

    }
