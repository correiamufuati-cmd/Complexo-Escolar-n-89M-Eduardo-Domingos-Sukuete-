<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<title>Teste PDF</title>
</head>

<body>

<h2>VERSÃO NOVA DO TESTE</h2>

<input type="file" id="pdfFile" accept="application/pdf">

<pre id="resultado"></pre>


<script>

const input = document.getElementById("pdfFile");
const resultado = document.getElementById("resultado");


resultado.innerHTML = "Página carregada";


input.addEventListener("change", async function(){

    const arquivo = input.files[0];

    if(!arquivo){
        return;
    }


    resultado.innerHTML =
    "Ficheiro recebido: " + arquivo.name;


    try {

        const pdfjsLib = await import(
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.mjs"
        );


        resultado.innerHTML +=
        "\n\nPDF.js carregado!";


    } catch(erro){

        resultado.innerHTML =
        "Erro PDF.js: " + erro.message;

    }


});

</script>

</body>

</html>
