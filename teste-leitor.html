const input = document.getElementById("pdfFile");

const resultado = document.getElementById("resultado");





function extrairDadosTurma(items){


    const texto = items
    .map(item => item.str.trim())
    .join(" ");



    let classe = "";

    let turma = "";

    let ano = "";



    const c = texto.match(/Classe:\s*(\d+)/);


    if(c){

        classe = c[1] + "ª";

    }



    const t = texto.match(/Turma:\s*([A-Z])/);


    if(t){

        turma = t[1];

    }



    const a = texto.match(/202\s?\d\s*\/\s*202\s?\d/);


    if(a){

        ano = a[0];

    }



    return {

        classe,
        turma,
        ano

    };


}







function extrairAlunos(items){


    let alunos = [];


    let iniciar = false;


    let i = 0;



    while(i < items.length){


        let valor = items[i].str.trim();



        if(valor === "N°"){

            iniciar = true;

            i++;

            continue;

        }



        if(!iniciar){

            i++;

            continue;

        }





        if(/^\d+$/.test(valor)){



            let numero = valor;


            i++;



            let nome = "";

            let sexo = "";





            while(i < items.length){



                let campo = items[i].str.trim();



                if(campo === "M" || campo === "F"){


                    sexo = campo;

                    break;

                }




                if(campo !== ""){


                    nome += campo + " ";

                }



                i++;


            }




            i++;



            let data = "";





            while(i < items.length){



                let campo = items[i].str.trim();



                if(/^\d{4}$/.test(campo)){


                    data += campo;

                    i++;

                    break;

                }




                if(campo !== ""){


                    data += campo + " ";

                }



                i++;


            }






            let idade = "";




            while(i < items.length){



                let campo = items[i].str.trim();



                if(/\d+\s?(anos|Anos|ano)/i.test(campo)){


                    idade = campo;

                    break;


                }



                i++;


            }






            alunos.push({


                numero,

                nome:nome.trim(),

                sexo,

                data:data.trim(),

                idade


            });



        }




        i++;



    }




    return alunos;



}
