<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<title>Teste PDF</title>
</head>

<body>

<h2>VERSÃO NOVA DO TESTE</h2>

<input type="file" id="pdfFile" accept="application/pdf">

<pre id="resultado"></pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

const input = document.getElementById("pdfFile");
const resultado = document.getElementById("resultado");


resultado.innerHTML = "Página carregada";

function criarTabela(texto){

    let html = `

    <table border="1" cellpadding="5">

    <tr>
        <th>Nº</th>
        <th>Nome Completo</th>
        <th>Sexo</th>
        <th>Data Nascimento</th>
        <th>Idade</th>
        <th>Obs</th>
    </tr>

    `;


    const linhas = texto.split(/\n/);


    linhas.forEach(linha=>{

        linha = linha.trim();


        if(/^\d+\s/.test(linha)){


            const numero = linha.match(/^\d+/)[0];


            let resto = linha.replace(numero,"").trim();


            let sexo = resto.match(/\s(M|F)\s/);


            if(sexo){


                const nome = resto.substring(
                    0,
                    sexo.index
                ).trim();


                resto = resto.substring(
                    sexo.index + sexo[0].length
                );


                const data = resto.match(
                /\d+\s-\s\d+\s-\s\d+/
                );


                const idade = resto.match(
                /\d+\s?(anos|Ano|anos\s?)/i
                );


                html += `

                <tr>

                <td>${numero}</td>

                <td>${nome}</td>

                <td>${sexo[1]}</td>

                <td>${data ? data[0] : ""}</td>

                <td>${idade ? idade[0] : ""}</td>

                <td></td>

                </tr>

                `;

            }

        }


    });


    html += "</table>";


    return html;

}

    const arquivo = input.files[0];

    if(!arquivo){

    }

            content.items.forEach(item => {

    texto += item.str + "\n";

});

        }


        resultado.innerHTML = criarTabela(texto);


    } catch(erro){

        resultado.innerHTML =
        "Erro ao ler PDF: " + erro.message;

    }


});

</script>
</body>

</html>
