<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<title>Teste PDF</title>
</head>

<body>

<h2>Teste Leitor PDF</h2>

<input type="file" id="pdfFile" accept="application/pdf">

<pre id="resultado"></pre>


<script type="module">

import { lerPDF } from "./services/pdf-reader.js";


const input = document.getElementById("pdfFile");
const resultado = document.getElementById("resultado");


input.addEventListener("change", async()=>{

    const arquivo = input.files[0];

    if(!arquivo) return;


    resultado.innerHTML = "A ler PDF...";


    try{

        const texto = await lerPDF(arquivo);


        resultado.innerHTML =
        texto || "Nenhum texto encontrado";


    }catch(erro){

        resultado.innerHTML =
        "Erro: " + erro.message;

    }

});


</script>

</body>

  </html>
