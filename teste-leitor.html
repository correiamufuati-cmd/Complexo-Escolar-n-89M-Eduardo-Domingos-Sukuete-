<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<title>Teste PDF</title>
</head>

<body>

<h2>VERSÃO NOVA DO TESTE</h2>

<input type="file" id="pdfFile" accept="application/pdf">

<pre id="resultado"></pre>

<script src="services/pdf-reader.js"></script>
    
<script>

function lerPDF(file){

    return "PDF-READER FUNCIONOU: " + file.name;

}


const input = document.getElementById("pdfFile");
const resultado = document.getElementById("resultado");


if(typeof lerPDF === "function"){

    resultado.innerHTML = "PDF-READER encontrado";

}else{

    resultado.innerHTML = "PDF-READER NÃO encontrado";

}


input.addEventListener("change", async function(){

    const arquivo = input.files[0];

    resultado.innerHTML =
    "A ler PDF...";


    try{

        const texto = await lerPDF(arquivo);


        resultado.innerHTML =
        "Texto encontrado:\n\n" +
        (texto || "Nenhum texto encontrado");


    }catch(erro){

        resultado.innerHTML =
        "Erro: " + erro.message;

    }

});

</script>
</body>

    </html>
