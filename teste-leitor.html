<script>


const input = document.getElementById("pdfFile");

const resultado = document.getElementById("resultado");



function extrairDadosTurma(items){


    const texto = items
    .map(item=>item.str)
    .join(" ");



    let classe="";
    let turma="";
    let ano="";



    let c = texto.match(/Classe[:\s]*(\d+)/i);

    if(c){
        classe = c[1]+"ª";
    }



    let t = texto.match(/Turma[:\s]*([A-Z])/i);

    if(t){
        turma=t[1];
    }



    let a = texto.match(/20\d{2}\s*\/\s*20\d{2}/);

    if(a){
        ano=a[0];
    }



    return {

        classe,
        turma,
        ano

    };


}






function extrairAlunos(items){


    let alunos=[];


    let iniciou=false;



    for(let i=0; i<items.length; i++){



        let valor = items[i].str.trim();



        if(valor==="N°" || valor==="Nº"){


            iniciou=true;

            continue;

        }



        if(!iniciou){

            continue;

        }





        if(/^\d+$/.test(valor)){



            let numero=valor;


            let nome="";

            let sexo="";

            let data="";

            let idade="";





            let j=i+1;



            while(j < items.length){



                let campo=items[j].str.trim();




                if(campo==="M" || campo==="F"){


                    sexo=campo;

                    j++;

                    break;

                }



                if(campo!==""){

                    nome += campo+" ";

                }



                j++;


            }






            while(j < items.length){



                let campo=items[j].str.trim();



                if(/\d{1,2}\/\d{1,2}\/\d{4}/.test(campo)){


                    data=campo;

                    j++;

                    break;

                }



                j++;


            }





            while(j < items.length){



                let campo=items[j].str.trim();



                if(/^\d+$/.test(campo)){


                    idade=campo;

                    break;

                }



                j++;

            }





            alunos.push({

                numero,

                nome:nome.trim(),

                sexo,

                data,

                idade

            });



            i=j-1;


        }



    }



    return alunos;


}
